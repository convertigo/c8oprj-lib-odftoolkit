accessibility: Hidden
comment: 'Demo sequence: fills the Word, PowerPoint and Excel templates of .//templates/office with u_fill_odt, then converts the results to PDF with u_convert.'
responseTimeout: 300
↓build_markers [steps.SimpleStep-1791400000068]: 
  expression: |
    '// Markers of the templates of .//templates/office (one entry per tag of each template).
    var today = String(new java.text.SimpleDateFormat("dd/MM/yyyy").format(new java.util.Date()));
    var word_markers = [
    	{ tag: "__c8o_date", value: today },
    	{ tag: "__c8o_objet", type: "span", value: "Resignation Letter", style: { fontName: "Arial", fontStyle: "ITALIC", fontSize: "12", fontColor: "RED" } },
    	{ tag: "__c8o_texte", value: "Dear Sir, Madam,\n\nI am writing to inform you of my decision to resign from my position, effective from 04/05/2025.\n\nThank you for the opportunities I have been given.\n\nSincerely,\n\nSarah Palin" },
    	{ tag: "__c8o_signature", type: "image", value: ".//templates/sarah_signature_sample.png" }
    ];
    var powerpoint_markers = [
    	{ tag: "{titre}", value: "Rapport trimestriel" },
    	{ tag: "{sous_titre}", value: "T3 2026\nDirection commerciale" },
    	{ tag: "logo", type: "image", value: ".//templates/odp/sample_logo.png" },
    	{ tag: "{note_orateur}", value: "Insister sur la croissance du trimestre." },
    	{ tag: "{points}", type: "list", value: ["Chiffre d''affaires +12 %", "Trois nouveaux clients", "Lancement de l''offre Cloud"] },
    	{ tag: "{date}", value: today },
    	{ tag: "{titre_tableau}", value: "Ventes par produit" },
    	{ tag: "{lignes}", type: "rows", value: [
    		["Convertigo Low Code", "12", "24 000 EUR"],
    		["C8oForms", "30", "18 500 EUR"],
    		["Support", "-", "6 000 EUR"]
    	] },
    	{ tag: "{produits}", type: "slides", value: [
    		[
    			{ tag: "{produit_nom}", value: "Convertigo Low Code" },
    			{ tag: "{produit_description}", value: "Plateforme de developpement d''applications mobiles et web." },
    			{ tag: "{produit_photo}", type: "image", value: ".//templates/odp/sample_photo_1.png" }
    		],
    		[
    			{ tag: "{produit_nom}", value: "C8oForms" },
    			{ tag: "{produit_description}", value: "Formulaires no code connectes a vos donnees." },
    			{ tag: "{produit_photo}", type: "image", value: ".//templates/odp/sample_photo_2.png" }
    		]
    	] },
    	{ tag: "{pied_de_page}", value: "Convertigo - Demo lib_fill_odt_pdf" }
    ];
    // Excel: numbers stay numbers, the Total column and the SUM below the rows are formulas of the template.
    var excel_markers = [
    	{ tag: "{titre}", value: "Ventes T3" },
    	{ tag: "{date}", value: today },
    	{ tag: "{client}", type: "span", value: "ACME", style: { fontStyle: "BOLD", fontColor: "RED" } },
    	{ tag: "{lignes}", type: "rows", value: [
    		["Convertigo Low Code", 12, 2000],
    		["C8oForms", 30, 600],
    		["Support", 1, 6000]
    	] },
    	{ tag: "{logo}", type: "image", value: ".//templates/odp/sample_logo.png", width: "4cm" }
    ];'

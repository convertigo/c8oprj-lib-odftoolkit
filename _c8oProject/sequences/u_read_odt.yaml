↓read_table [steps.SimpleStep-1740317603631]: 
  expression: |
    '/* =====================================================================================
     * u_read_odt / SimpleStep "read_table"
     *
     * Dev sequence: reads the first cell of a table of a text document with the odfdom 0.13
     * table API (style name, value, background color, format string).
     * ===================================================================================== */
    
    var odf_api = JavaImporter(
    	Packages.org.odftoolkit.odfdom.doc.OdfDocument,
    	java.io.File
    );
    
    var _error = false;
    var _error_code = "-1";
    var _error_msg = "";
    var _error_stack = "";
    var cell_style = "";
    var cell_value = "";
    var cell_bgcolor = "";
    var cell_format = "";
    var read_table = "";
    
    function get_full_path(file_path) {
    	if (file_path != null && file_path != "") {
    		file_path = String(file_path);
    		var project_directory_path = String(context.getProjectDirectory()).replace(/\\/g, "/") + "/";
    		if (file_path.indexOf(".//") == 0) {
    			file_path = project_directory_path + file_path.substring(3);
    		} else if (file_path.indexOf("./") == 0) {
    			file_path = project_directory_path + "../" + file_path.substring(2);
    		}
    	}
    	return file_path;
    }
    
    var output_path = get_full_path(output_filename);
    
    with (odf_api) {
    	var document = null;
    	try {
    		if (!new File(output_path).isFile()) throw "File not found: " + output_path;
    		document = OdfDocument.loadDocument(output_path);
    		var name = table_name != null && String(table_name) != "" ? String(table_name) : "table1";
    		var table = document.getTableByName(name);
    		if (table == null) {
    			// Tables built by u_fill_odt have generated names: fall back to the first table.
    			var tables = document.getTableList(false);
    			table = tables.size() > 0 ? tables.get(0) : null;
    		}
    		if (table == null) throw "No table in " + output_path;
    		read_table = String(table.getTableName());
    		var cell = table.getCellByPosition(0, 0);
    		cell_style = String(cell.getStyleName() || "");
    		cell_value = String(cell.getStringValue() || "");
    		cell_bgcolor = String(cell.getCellBackgroundColorString() || "");
    		cell_format = String(cell.getFormatString() || "");
    		log.info("[u_read_odt] table ''" + read_table + "'' cell A1: style=" + cell_style + " value=" + cell_value + " bgColor=" + cell_bgcolor + " format=" + cell_format);
    	} catch (e) {
    		log.error("[u_read_odt] " + e);
    		_error = true;
    		_error_msg = "ERROR: reading ''" + output_path + "''";
    		_error_stack = "" + e;
    	} finally {
    		if (document != null) document.close();
    	}
    }'

accessibility: Private
authenticatedContextRequired: false
comment: |
  'Converts a document with LibreOffice (headless) to another format: pdf, docx, xlsx, pptx, odt, ods, odp, doc, xls, ppt, rtf, txt, csv, html, epub, png, svg...
  The input can be any document LibreOffice opens (odt, ods, odp, docx, xlsx, pptx...).
  LibreOffice is resolved from the global symbol ''lib_fill_odt_pdf.soffice_path'', then the SOFFICE_PATH environment variable, then the default install paths, then ''soffice'' from the PATH.
  It outputs an attachment structure: call it with the .bin requester from a wrapper sequence to trigger a download in the client browser.'
responseTimeout: 300
↓convert [steps.SimpleStep-1791100000001]: 
  expression: |
    '/* =====================================================================================
     * u_convert / SimpleStep "convert"
     *
     * Converts any document LibreOffice can open (odt, ods, odp, docx, xlsx, pptx, doc...)
     * to another format with LibreOffice headless: pdf, docx, xlsx, pptx, odt, html...
     *
     * - The target format comes from "target_format" or, if empty, from the output file
     *   extension. A LibreOffice filter can be forced: "pdf:writer_pdf_Export:{...}".
     * - The LibreOffice executable is never taken from the request: it is resolved from the
     *   global symbol "lib_fill_odt_pdf.soffice_path", then the SOFFICE_PATH environment
     *   variable, then the default install paths, then "soffice" from the PATH.
     * - Each conversion runs in its own temporary folder (LibreOffice profile + output), so
     *   parallel conversions do not collide. The folder is always removed.
     * ===================================================================================== */
    
    var J = JavaImporter(
    	java.io.File,
    	java.lang.ProcessBuilder,
    	java.util.concurrent.TimeUnit,
    	java.nio.file.Files,
    	java.nio.file.StandardCopyOption,
    	java.util.ArrayList
    );
    
    var _error = false;
    var _error_code = "-1";
    var _error_msg = "";
    var _error_stack = "";
    
    // Rhino may pass concatenated strings as ConsString: force java.lang.String for Java APIs.
    function jstr(v) {
    	return new java.lang.String(String(v));
    }
    
    var MIME_TYPES = {
    	pdf: "application/pdf",
    	odt: "application/vnd.oasis.opendocument.text",
    	ods: "application/vnd.oasis.opendocument.spreadsheet",
    	odp: "application/vnd.oasis.opendocument.presentation",
    	odg: "application/vnd.oasis.opendocument.graphics",
    	fodt: "application/vnd.oasis.opendocument.text-flat-xml",
    	fods: "application/vnd.oasis.opendocument.spreadsheet-flat-xml",
    	fodp: "application/vnd.oasis.opendocument.presentation-flat-xml",
    	docx: "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
    	xlsx: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
    	pptx: "application/vnd.openxmlformats-officedocument.presentationml.presentation",
    	doc: "application/msword",
    	xls: "application/vnd.ms-excel",
    	ppt: "application/vnd.ms-powerpoint",
    	rtf: "application/rtf",
    	txt: "text/plain",
    	csv: "text/csv",
    	html: "text/html",
    	xhtml: "application/xhtml+xml",
    	epub: "application/epub+zip",
    	png: "image/png",
    	jpg: "image/jpeg",
    	svg: "image/svg+xml"
    };
    
    function get_full_path(file_path) {
    	if (file_path != null && file_path != "") {
    		file_path = String(file_path);
    		var project_directory_path = String(context.getProjectDirectory()).replace(/\\/g, "/") + "/";
    		if (file_path.indexOf(".//") == 0) {
    			file_path = project_directory_path + file_path.substring(3);
    		} else if (file_path.indexOf("./") == 0) {
    			file_path = project_directory_path + "../" + file_path.substring(2);
    		}
    	}
    	return file_path;
    }
    
    function get_file_name(file_path) {
    	if (file_path != null && file_path != "") {
    		return String(org.apache.commons.io.FilenameUtils.getName(get_full_path(file_path)));
    	}
    	return "";
    }
    
    function extensionOf(path) {
    	var name = String(path).replace(/^.*[\/\\]/, "");
    	return name.indexOf(".") == -1 ? "" : name.replace(/^.*\./, "").toLowerCase();
    }
    
    var input_path = get_full_path(input_filename);
    var output_path = get_full_path(output_filename);
    var file_name = get_file_name(output_filename);
    var content_type = "application/octet-stream";
    
    with (J) {
    
    	function resolveSoffice() {
    		var configured = [];
    		try {
    			var symbol = com.twinsoft.convertigo.engine.Engine.theApp.databaseObjectsManager.symbolsGetValue("lib_fill_odt_pdf.soffice_path");
    			if (symbol != null && String(symbol).trim() != "") configured.push(String(symbol).trim());
    		} catch (e) {
    			log.debug("[u_convert] Cannot read symbol lib_fill_odt_pdf.soffice_path: " + e);
    		}
    		var env = java.lang.System.getenv("SOFFICE_PATH");
    		if (env != null && String(env).trim() != "") configured.push(String(env).trim());
    		for (var i = 0; i < configured.length; i++) {
    			// A bare command name ("soffice", "libreoffice") is looked up in the PATH.
    			if (new File(configured[i]).isFile() || !/[\/\\]/.test(configured[i])) return configured[i];
    			log.warn("[u_convert] Configured LibreOffice path does not exist: " + configured[i]);
    		}
    		var os = String(java.lang.System.getProperty("os.name")).toLowerCase();
    		var defaults = [];
    		if (os.indexOf("mac") != -1) {
    			defaults = ["/Applications/LibreOffice.app/Contents/MacOS/soffice"];
    		} else if (os.indexOf("win") != -1) {
    			defaults = ["C:/Program Files/LibreOffice/program/soffice.exe", "C:/Program Files (x86)/LibreOffice/program/soffice.exe"];
    		} else {
    			defaults = ["/usr/bin/soffice", "/usr/lib/libreoffice/program/soffice", "/opt/libreoffice/program/soffice", "/snap/bin/libreoffice"];
    		}
    		for (var d = 0; d < defaults.length; d++) {
    			if (new File(defaults[d]).isFile()) return defaults[d];
    		}
    		return "soffice";
    	}
    
    	function deleteRecursive(file) {
    		if (file == null || !file.exists()) return;
    		var children = file.listFiles();
    		if (children != null) {
    			for (var i = 0; i < children.length; i++) {
    				// Never follow symbolic links out of the work folder.
    				if (Files.isSymbolicLink(children[i].toPath())) {
    					children[i]["delete"]();
    				} else {
    					deleteRecursive(children[i]);
    				}
    			}
    		}
    		file["delete"]();
    	}
    
    	function readText(file) {
    		try {
    			return file.exists() ? String(new java.lang.String(Files.readAllBytes(file.toPath()), "UTF-8")) : "";
    		} catch (e) {
    			return "";
    		}
    	}
    
    	var workDir = null;
    	try {
    		var inFile = new File(input_path);
    		if (!inFile.isFile()) throw "Input file not found: " + input_path;
    		if (output_path == null || output_path == "") throw "output_filename is required";
    
    		var target = target_format != null && String(target_format).trim() != "" ? String(target_format).trim() : extensionOf(output_path);
    		var targetExt = target.split(":")[0].toLowerCase();
    		if (!MIME_TYPES[targetExt]) throw "Unsupported target format ''" + target + "''. Supported: " + Object.keys(MIME_TYPES).join(", ");
    		if (/[\r\n]/.test(target)) throw "Invalid target format";
    		content_type = MIME_TYPES[targetExt];
    
    		var timeoutSeconds = parseInt(timeout, 10);
    		if (isNaN(timeoutSeconds) || timeoutSeconds <= 0) timeoutSeconds = 120;
    
    		workDir = Files.createTempDirectory("c8o-convert-").toFile();
    		var profileDir = new File(workDir, "profile");
    		var outDir = new File(workDir, "out");
    		profileDir.mkdirs();
    		outDir.mkdirs();
    		var logFile = new File(workDir, "soffice.log");
    
    		var soffice = resolveSoffice();
    		var cmd = new ArrayList();
    		cmd.add(jstr(soffice));
    		cmd.add(jstr("--headless"));
    		cmd.add(jstr("--invisible"));
    		cmd.add(jstr("--nologo"));
    		cmd.add(jstr("--nodefault"));
    		cmd.add(jstr("--nolockcheck"));
    		cmd.add(jstr("--nofirststartwizard"));
    		cmd.add(jstr("--norestore"));
    		cmd.add(jstr("-env:UserInstallation=" + profileDir.toPath().toUri().toString()));
    		cmd.add(jstr("--convert-to"));
    		cmd.add(jstr(target));
    		cmd.add(jstr("--outdir"));
    		cmd.add(jstr(outDir.getAbsolutePath()));
    		cmd.add(jstr(inFile.getAbsolutePath()));
    		log.info("[u_convert] Running: " + cmd.toString());
    
    		var pb = new ProcessBuilder(cmd);
    		pb.redirectErrorStream(true);
    		pb.redirectOutput(logFile);
    		var process = null;
    		try {
    			process = pb.start();
    		} catch (e) {
    			_error_code = "-2";
    			throw "LibreOffice can not be started with ''" + soffice + "''. Install LibreOffice (on Docker, enable the init_config auto start) or set the global symbol lib_fill_odt_pdf.soffice_path. Cause: " + e;
    		}
    		if (!process.waitFor(timeoutSeconds, TimeUnit.SECONDS)) {
    			process.destroyForcibly();
    			_error_code = "-3";
    			throw "LibreOffice timed out after " + timeoutSeconds + "s. Output: " + readText(logFile);
    		}
    		var output = readText(logFile);
    		log.debug("[u_convert] LibreOffice output: " + output);
    		if (process.exitValue() != 0) throw "LibreOffice failed with code " + process.exitValue() + ". Output: " + output;
    
    		var baseName = String(inFile.getName()).replace(/\.[^.]+$/, "");
    		var produced = new File(outDir, baseName + "." + targetExt);
    		if (!produced.isFile()) {
    			var files = outDir.listFiles();
    			produced = files != null && files.length == 1 ? files[0] : null;
    		}
    		if (produced == null || !produced.isFile()) throw "LibreOffice did not produce a ''" + targetExt + "'' file. Output: " + output;
    
    		var outFile = new File(output_path);
    		if (outFile.getAbsoluteFile().getParentFile() != null) outFile.getAbsoluteFile().getParentFile().mkdirs();
    		Files.move(produced.toPath(), outFile.toPath(), StandardCopyOption.REPLACE_EXISTING);
    		if (String(delete_at_end_of_session) != "false") context.addFileToDeleteAtEndOfSession(outFile);
    		log.info("[u_convert] Converted ''" + input_path + "'' to ''" + output_path + "''");
    	} catch (e) {
    		log.error("[u_convert] " + e);
    		_error = true;
    		_error_msg = "ERROR: converting file ''" + input_path + "''";
    		_error_stack = "" + e;
    	} finally {
    		deleteRecursive(workDir);
    	}
    }'

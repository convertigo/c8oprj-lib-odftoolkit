↓build_template [steps.SimpleStep-1740155874256]: 
  expression: |
    '/* =====================================================================================
     * u_create_odt / SimpleStep "build_template"
     *
     * Creates an empty text document holding one paragraph per marker (in the markers order),
     * then the next step fills it with u_fill_odt: every u_fill_odt marker type is available.
     * "string" and "paragraph" values are written with their "style" font (Arial 10 by
     * default), tables are not preceded by a page break.
     * ===================================================================================== */
    
    var odf_api = JavaImporter(
    	Packages.org.odftoolkit.odfdom.doc.OdfTextDocument,
    	java.io.File
    );
    
    var _error = false;
    var _error_code = "-1";
    var _error_msg = "";
    var _error_stack = "";
    var template_path = "";
    var fill_markers = "[]";
    
    var OFFICE_NS = "urn:oasis:names:tc:opendocument:xmlns:office:1.0";
    var TEXT_NS = "urn:oasis:names:tc:opendocument:xmlns:text:1.0";
    
    // Plain JS copy of a marker structure (Java strings and arrays included).
    function toPlain(v) {
    	if (v == null) return null;
    	if (typeof v == "string" || v instanceof String || v instanceof java.lang.String) {
    		var s = String(v).trim();
    		if (s.charAt(0) == "[" || s.charAt(0) == "{") {
    			try {
    				return toPlain(JSON.parse(s));
    			} catch (e) {}
    		}
    		return String(v);
    	}
    	if (typeof v == "number" || typeof v == "boolean") return v;
    	if (v instanceof Number || v instanceof Boolean) return v.valueOf();
    	if (v instanceof java.util.List) v = v.toArray();
    	if (Array.isArray(v) || (v instanceof java.lang.Object && v.getClass().isArray())) {
    		var a = [];
    		for (var i = 0; i < v.length; i++) a.push(toPlain(v[i]));
    		return a;
    	}
    	if (v instanceof java.lang.Object) return String(v.toString());
    	var o = {};
    	for (var k in v) o[k] = toPlain(v[k]);
    	return o;
    }
    
    with (odf_api) {
    	var doc = null;
    	try {
    		var markers = toPlain(typeof o_markers != "undefined" ? o_markers : null);
    		if (markers != null && !Array.isArray(markers)) markers = markers.array != null ? markers.array : [markers];
    		markers = markers || [];
    		doc = OdfTextDocument.newTextDocument();
    		var dom = doc.getContentDom();
    		var body = dom.getElementsByTagNameNS(OFFICE_NS, "text").item(0);
    		var paragraphs = body.getElementsByTagNameNS(TEXT_NS, "p");
    		while (paragraphs.getLength() > 0) paragraphs.item(0).getParentNode().removeChild(paragraphs.item(0));
    		var fill = [];
    		for (var i = 0; i < markers.length; i++) {
    			var m = markers[i] || {};
    			var tag = "{{c8o_create_" + i + "}}";
    			var p = dom.createElementNS(TEXT_NS, "text:p");
    			p.appendChild(dom.createTextNode(tag));
    			body.appendChild(p);
    			var type = m.type ? String(m.type) : "string";
    			if (type == "string" || type == "paragraph") type = "span";
    			fill.push({ tag: tag, type: type, value: m.value, style: m.style || {}, merges: m.merges, fit: m.fit, width: m.width, height: m.height });
    		}
    		var meta = doc.getOfficeMetadata();
    		meta.setAutomaticUpdate(false);
    		meta.setGenerator("Convertigo lib_fill_odt_pdf (odfdom-java 0.13.0)");
    		meta.setDate(new java.util.GregorianCalendar());
    		var templateFile = File.createTempFile("c8o-create-", ".odt");
    		doc.save(templateFile.getAbsolutePath());
    		context.addFileToDeleteAtEndOfSession(templateFile);
    		template_path = String(templateFile.getAbsolutePath());
    		fill_markers = JSON.stringify(fill);
    	} catch (e) {
    		log.error("[u_create_odt] " + e);
    		_error = true;
    		_error_msg = "ERROR: creating the document";
    		_error_stack = "" + e;
    	} finally {
    		if (doc != null) doc.close();
    	}
    }'

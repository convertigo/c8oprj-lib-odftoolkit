  expression: |
    '/* =====================================================================================
     * u_fill_ooxml / SimpleStep "fill_template"
     *
     * Fills a template designed with Microsoft Office: Word (docx, dotx, docm), PowerPoint
     * (pptx, potx, pptm) or Excel (xlsx, xltx, xlsm), with the markers of u_fill_odt.
     * The package is edited in place: only the XML parts holding tags are rewritten, so the
     * formatting of the template is kept, and LibreOffice is not needed.
     *
     * Tags may be split across runs by Office (spell check, revisions...): the runs are split
     * so that the replacement takes the formatting of the first character of the tag.
     *
     * Marker types ("slides" first, then "rows" / "list", then the others, in array order):
     *   string, paragraph, newline, span, array : Word, PowerPoint, Excel.
     *   image  : picture named after the tag (Alt text title or name), text box holding only
     *            the tag (PowerPoint), text tag (inline picture in Word, picture anchored on
     *            the cell in Excel). Options: fit (contain, stretch), width, height.
     *   table, tableh, tablet : Word builds a table in place of the tag (tablet: styles of
     *            the 1x3 table of table_template_file, a .docx, found by its Alt text title
     *            table_template_name). Excel: same as rows. PowerPoint: use rows.
     *   list   : the paragraph holding the tag is repeated (Excel: one row per value).
     *   rows   : the table row (Excel: the sheet row) holding the tag is repeated. Excel rows
     *            below are shifted, formulas, merged cells, tables and charts are updated and
     *            references to the template row in formulas cover all the generated rows.
     *   slides : the slide holding the tag is repeated (PowerPoint).
     * ===================================================================================== */
    

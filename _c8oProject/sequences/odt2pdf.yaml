        '/* =====================================================================================
         * odt2pdf / SimpleStep "export"
         *
         * Previous converter of odt2pdf (XDocReport 1.0 ODFDOM converter + iText 2.1.7), used when
         * LibreOffice is not installed (see the "prepare" step). Its jars are built on odfdom 0.8/0.9,
         * which can not be loaded next to odfdom 0.13 (same packages): they are kept in
         * libs/legacy_pdf (not loaded by the project) and loaded by a separate class loader whose
         * parent is the platform class loader, created once and shared through context.server.
         * PdfConverter, PdfOptions, FontFactory and OdfTextDocument below give the code of the
         * previous version access to these classes.
         * ===================================================================================== */
        
        var LEGACY_PDF_DIR = "libs/legacy_pdf";
        
        function legacyPdfLoader() {
        	var dir = new java.io.File(String(context.getProjectDirectory()), LEGACY_PDF_DIR).getCanonicalFile();
        	var key = "lib_fill_odt_pdf.legacy_pdf_loader:" + dir.getPath();
        	var server = context.server;
        	var locked = new Packages.org.mozilla.javascript.Synchronizer(function () {
        		var loader = server.get(key);
        		if (loader != null) return loader;
        		var files = dir.listFiles();
        		var jars = [];
        		for (var i = 0; files != null && i < files.length; i++) {
        			if (/\.jar$/i.test(String(files[i].getName()))) jars.push(files[i]);
        		}
        		if (jars.length == 0) throw "The previous PDF converter is missing: no jar in " + dir.getPath();
        		jars.sort(function (a, b) { return String(a.getName()) < String(b.getName()) ? -1 : 1; });
        		var urls = java.lang.reflect.Array.newInstance(java.net.URL, jars.length);
        		for (var j = 0; j < jars.length; j++) urls[j] = jars[j].toURI().toURL();
        		loader = new java.net.URLClassLoader(urls, java.lang.ClassLoader.getPlatformClassLoader());
        		server.set(key, loader);
        		return loader;
        	}, server);
        	return locked();
        }
        
        var legacy_pdf_loader = legacyPdfLoader();
        
        function legacyStatic(className, methodName, types, values) {
        	var classes = java.lang.reflect.Array.newInstance(java.lang.Class, types.length);
        	var args = java.lang.reflect.Array.newInstance(java.lang.Object, values.length);
        	for (var i = 0; i < types.length; i++) classes[i] = types[i];
        	for (var j = 0; j < values.length; j++) args[j] = values[j] == null ? null : String(values[j]);
        	var method = java.lang.Class.forName(className, true, legacy_pdf_loader).getMethod(methodName, classes);
        	var thread = java.lang.Thread.currentThread();
        	var previous = thread.getContextClassLoader();
        	thread.setContextClassLoader(legacy_pdf_loader);
        	try {
        		return method.invoke(null, args);
        	} catch (e) {
        		var cause = e.javaException != null ? e.javaException.getCause() : null;
        		throw cause != null ? cause : e;
        	} finally {
        		thread.setContextClassLoader(previous);
        	}
        }
        

comment: Convert an ODT file to a PDF file with LibreOffice (u_convert). Fonts from fonts_folder or font_paths are embedded for the conversion.
↓inputVars [steps.InputVariablesStep-1791200000024]: 
↓prepare [steps.SimpleStep-1743693982367]: 
  expression: |
    '/* =====================================================================================
     * odt2pdf / SimpleStep "prepare"
     *
     * The conversion is done by u_convert with LibreOffice (the XDocReport / iText 2.1.7
     * converter is removed). Fonts given with fonts_folder or font_paths / font_aliases are
     * embedded in the document for the conversion. The multi-valued variables are passed
     * to u_convert as JSON arrays.
     * ===================================================================================== */
    
    function values(v) {
    	var out = [];
    	if (v == null) return out;
    	if (typeof v == "string" || v instanceof String || v instanceof java.lang.String) {
    		if (String(v) != "") out.push(String(v));
    		return out;
    	}
    	for (var i = 0; i < v.length; i++) {
    		if (v[i] != null && String(v[i]) != "") out.push(String(v[i]));
    	}
    	return out;
    }
    
    var font_paths_json = JSON.stringify(values(font_paths));
    var font_aliases_json = JSON.stringify(values(font_aliases));'

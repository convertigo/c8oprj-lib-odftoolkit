        	function writeZipEntry(zip, sourceEntry, bytes){
        	    var newEntry = new ZipEntry(sourceEntry.getName());
        	    if (sourceEntry.getTime() >= 0) {
        	        newEntry.setTime(sourceEntry.getTime());
        	    }
        	    if (sourceEntry.getMethod() == ZipEntry.STORED) {
        	        var crc = new CRC32();
        	        crc.update(bytes);
        	        newEntry.setMethod(ZipEntry.STORED);
        	        newEntry.setSize(bytes.length);
        	        newEntry.setCompressedSize(bytes.length);
        	        newEntry.setCrc(crc.getValue());
        	    }
        	    zip.putNextEntry(newEntry);
        	    zip.write(bytes);
        	    zip.closeEntry();
        	}
        	
        	function createNormalizedOdtForFirstPageHeaders(filePath){
        	    first_page_master_names = new HashMap();
        	    normalized_first_page_headers = false;
        	
        	    var stylesBytes = readZipEntry(filePath, "styles.xml");
        	    if (stylesBytes == null) {
        	        return null;
        	    }
        	
        	    var normalizedStylesBytes = normalizeStylesXml(stylesBytes);
        	    if (!normalized_first_page_headers) {
        	        return null;
        	    }
        	
        	    var tempFile = File.createTempFile("c8o-odt2pdf-", ".odt");
        	    var inputZip = null;
        	    var outputZip = null;
        	    try {
        	        inputZip = new ZipInputStream(new FileInputStream(new File(filePath)));
        	        outputZip = new ZipOutputStream(new FileOutputStream(tempFile));
        	
        	        var entry = null;
        	        while ((entry = inputZip.getNextEntry()) != null) {
        	            var entryName = String(entry.getName());
        	            var entryBytes = readAllBytes(inputZip);
        	
        	            if (entryName == "styles.xml") {
        	                entryBytes = normalizedStylesBytes;
        	            } else if (entryName == "content.xml") {
        	                entryBytes = normalizeMasterPageReferencesXml(entryBytes);
        	            }
        	
        	            writeZipEntry(outputZip, entry, entryBytes);
        	        }
        	    } catch (e) {
        	        try { tempFile["delete"](); } catch (ignore) {}
        	        throw e;
        	    } finally {
        	        if (inputZip) inputZip.close();
        	        if (outputZip) outputZip.close();
        	    }
        	
        	    log.warn("ODT normalized for first-page headers/footers before PDF conversion: " + tempFile.getAbsolutePath());
        	    return tempFile;
        	}
        	
        	try {
        		normalized_input_file = createNormalizedOdtForFirstPageHeaders(input_path);
        		var conversion_input_path = normalized_input_file == null ? input_path : normalized_input_file.getAbsolutePath();
        	
        		// Charger le fichier .odt
        		odt = OdfTextDocument.loadDocument(conversion_input_path);
        
        		// Options pour la conversion PDF
        		var options = PdfOptions.create();
        
        		// Enregistre la font depuis son fichier .ttf
        		if(fonts_folder != null && fonts_folder != ""){
        			registerAllFontsInFolder(fonts_folder);
        		} else if(font_paths != null && font_paths != "" && font_aliases != null && font_aliases != ""){
        			if (font_paths.length !== font_aliases.length) {
        		        log.warn("⚠️ Font arrays length mismatch!");
        		    } else {
        			    for (var i = 0; i < font_paths.length; i++) {
        			        FontFactory.register(get_full_path(font_paths[i]), font_aliases[i]);
        			        log.debug("✅ Registered Font: ''" + font_aliases[i] + "'' from: " + font_paths[i]);
        			    }
        		    }
        		}
        		
        		output = new FileOutputStream(new File(output_path));
        		
        		// Convertir en PDF
        		PdfConverter.getInstance().convert(odt, output, options);
        		log.debug("Conversion terminée !");
        	} catch (e) {
        		log.error("Erreur lors de la conversion : " + e);
        		_error = true;
        		_error_code = "-1";
        		_error_msg = "ERROR: converting file ''" + input_path + "''";
        		_error_stack = "" + e;
        	} finally {
        		if(output) output.close();
        		if(odt) odt.close();
        		if(normalized_input_file != null && normalized_input_file.exists()) normalized_input_file["delete"]();
        	}

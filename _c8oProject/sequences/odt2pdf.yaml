    '/* =====================================================================================
     * odt2pdf / SimpleStep "prepare"
     *
     * Chooses the converter:
     * - LibreOffice (u_convert) when it is installed. Fonts given with fonts_folder or
     *   font_paths / font_aliases are embedded in the document for the conversion, the
     *   multi-valued variables are passed to u_convert as JSON arrays.
     * - otherwise the converter of the previous versions (XDocReport + iText 2.1.7, step
     *   "export"), so that a server without LibreOffice works as before.
     * The global symbol lib_fill_odt_pdf.odt2pdf_converter (or the environment variable
     * LIB_FILL_ODT_PDF_ODT2PDF_CONVERTER) forces the choice: auto (default), libreoffice or legacy.
     * LibreOffice is looked up as u_convert does: global symbol lib_fill_odt_pdf.soffice_path,
     * SOFFICE_PATH environment variable, default install paths, then soffice in the PATH.
     * ===================================================================================== */
    
    function values(v) {
    	var out = [];
    	if (v == null) return out;
    	if (typeof v == "string" || v instanceof String || v instanceof java.lang.String) {
    		if (String(v) != "") out.push(String(v));
    		return out;
    	}
    	for (var i = 0; i < v.length; i++) {
    		if (v[i] != null && String(v[i]) != "") out.push(String(v[i]));
    	}
    	return out;
    }
    
    function setting(symbol, env) {
    	try {
    		var v = com.twinsoft.convertigo.engine.Engine.theApp.databaseObjectsManager.symbolsGetValue(symbol);
    		if (v != null && String(v).trim() != "") return String(v).trim();
    	} catch (e) {}
    	var e2 = java.lang.System.getenv(env);
    	return e2 != null ? String(e2).trim() : "";
    }
    
    function get_full_path(file_path) {
    	if (file_path != null && file_path != "") {
    		file_path = String(file_path);
    		var project_directory_path = String(context.getProjectDirectory()).replace(/\\/g, "/") + "/";
    		if (file_path.indexOf(".//") == 0) {
    			file_path = project_directory_path + file_path.substring(3);
    		} else if (file_path.indexOf("./") == 0) {
    			file_path = project_directory_path + "../" + file_path.substring(2);
    		}
    	}
    	return file_path;
    }
    
    function get_file_name(file_path) {
    	if (file_path != null && file_path != "") {
    		return String(org.apache.commons.io.FilenameUtils.getName(get_full_path(file_path)));
    	}
    	return "";
    }
    
    var windows = String(java.lang.System.getProperty("os.name")).toLowerCase().indexOf("win") != -1;
    
    function inPath(name) {
    	var path = java.lang.System.getenv("PATH");
    	if (path == null) return null;
    	var dirs = String(path).split(String(java.io.File.pathSeparator));
    	var suffixes = windows && !/\.exe$/i.test(name) ? [".exe", ""] : [""];
    	for (var i = 0; i < dirs.length; i++) {
    		for (var j = 0; j < suffixes.length; j++) {
    			if (dirs[i] == "") continue;
    			var f = new java.io.File(dirs[i], name + suffixes[j]);
    			if (f.isFile() && f.canExecute()) return String(f.getPath());
    		}
    	}
    	return null;
    }
    
    /* Path of the LibreOffice executable, or null when it is not installed. */
    function sofficePath() {
    	var configured = [];
    	var symbol = setting("lib_fill_odt_pdf.soffice_path", "SOFFICE_PATH");
    	if (symbol != "") configured.push(symbol);
    	var env = java.lang.System.getenv("SOFFICE_PATH");
    	if (env != null && String(env).trim() != "" && String(env).trim() != symbol) configured.push(String(env).trim());
    	for (var i = 0; i < configured.length; i++) {
    		if (!/[\/\\]/.test(configured[i])) {
    			var found = inPath(configured[i]);
    			if (found != null) return found;
    		} else if (new java.io.File(configured[i]).isFile()) {
    			return configured[i];
    		}
    	}
    	var os = String(java.lang.System.getProperty("os.name")).toLowerCase();
    	var defaults = [];
    	if (os.indexOf("mac") != -1) {
    		defaults = ["/Applications/LibreOffice.app/Contents/MacOS/soffice"];
    	} else if (windows) {
    		defaults = ["C:/Program Files/LibreOffice/program/soffice.exe", "C:/Program Files (x86)/LibreOffice/program/soffice.exe"];
    	} else {
    		defaults = ["/usr/bin/soffice", "/usr/lib/libreoffice/program/soffice", "/opt/libreoffice/program/soffice", "/snap/bin/libreoffice"];
    	}
    	for (var d = 0; d < defaults.length; d++) {
    		if (new java.io.File(defaults[d]).isFile()) return defaults[d];
    	}
    	return inPath("soffice");
    }
    
    var converter = setting("lib_fill_odt_pdf.odt2pdf_converter", "LIB_FILL_ODT_PDF_ODT2PDF_CONVERTER").toLowerCase();
    if (converter != "libreoffice" && converter != "legacy") converter = "auto";
    var use_office = converter == "libreoffice" || (converter == "auto" && sofficePath() != null);
    log.debug("[odt2pdf] converter: " + (use_office ? "LibreOffice (u_convert)" : "previous Java converter (XDocReport + iText 2.1.7)"));
    
    var output_path = get_full_path(output_filename);
    var file_name = get_file_name(output_filename);
    var font_paths_json = JSON.stringify(values(font_paths));
    var font_aliases_json = JSON.stringify(values(font_aliases));'

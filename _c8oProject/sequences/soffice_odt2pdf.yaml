comment: Convert an ODT file to a PDF file using LibreOffice (u_convert). The soffice_path variable is ignored, set the global symbol lib_fill_odt_pdf.soffice_path instead.
↓inputVars [steps.InputVariablesStep-1791200000036]: 
↓check [steps.SimpleStep-1768383988612]: 
  expression: |
    '/* =====================================================================================
     * soffice_odt2pdf / SimpleStep "check"
     *
     * The conversion is done by u_convert. For security reasons the LibreOffice executable
     * is not taken from the request anymore: "soffice_path" is ignored, set the global
     * symbol lib_fill_odt_pdf.soffice_path (or the SOFFICE_PATH environment variable).
     * ===================================================================================== */
    
    if (soffice_path != null && String(soffice_path) != "" && String(soffice_path) != "soffice") {
    	log.warn("[soffice_odt2pdf] soffice_path is ignored, set the global symbol lib_fill_odt_pdf.soffice_path instead");
    }'

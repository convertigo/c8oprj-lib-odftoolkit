  expression: |
    '/* =====================================================================================
     * u_fill_odp / SimpleStep "fill_template"
     *
     * Fills an OpenDocument template (designed for ODP presentations) by replacing tags.
     * The engine works on the raw ODF XML (content.xml + styles.xml) and only relies on
     * the ODFDOM core API that is identical in odfdom 0.9 and 0.13:
     *   OdfDocument.loadDocument / getContentDom / getStylesDom / getPackage().insert /
     *   getOfficeMetadata / save / close
     * so it does not depend on the deprecated Simple API (org.odftoolkit.simple.*).
     *
     * Marker types (processed in this order: "slides", then "rows" / "list", then the others):
     *   string  (default) : text replacement, "\n" = line break, "\t" = tab.
     *   list              : value = array of strings. The paragraph (or list item) holding
     *                       the tag is duplicated once per value.
     *   rows              : value = array of rows (arrays of cell values). The table row
     *                       holding the tag is duplicated once per row.
     *   image             : value = image path or data URI. The tag is either the name of
     *                       a picture/text frame, or a text frame holding only the tag.
     *                       Options: "fit" = "contain" (default) or "stretch".
     *   slides            : value = array of items (array of markers, or { markers: [...] }).
     *                       The slide holding the tag is duplicated once per item and the
     *                       item markers are applied to its copy only.
     * ===================================================================================== */
    
    var odf_api = JavaImporter(
    	Packages.org.odftoolkit.odfdom.doc.OdfDocument,
    	java.io.File,
    	java.io.ByteArrayInputStream,
    	java.nio.file.Files,
    	java.util.ArrayList,
    	java.util.UUID,
    	javax.imageio.ImageIO
    );
    
    var _error = false;
    var _error_code = "-1";
    var _error_msg = "";
    var _error_stack = "";
    var not_found = [];
    
    var NS = {
    	office: "urn:oasis:names:tc:opendocument:xmlns:office:1.0",
    	text: "urn:oasis:names:tc:opendocument:xmlns:text:1.0",
    	draw: "urn:oasis:names:tc:opendocument:xmlns:drawing:1.0",
    	table: "urn:oasis:names:tc:opendocument:xmlns:table:1.0",
    	svg: "urn:oasis:names:tc:opendocument:xmlns:svg-compatible:1.0",
    	xlink: "http://www.w3.org/1999/xlink",
    	xml: "http://www.w3.org/XML/1998/namespace",
    	presentation: "urn:oasis:names:tc:opendocument:xmlns:presentation:1.0",
    	calcext: "urn:org:documentfoundation:names:experimental:calc:xmlns:calcext:1.0"
    };
    
    var IMAGE_TYPES = {
    	png: "image/png",
    	jpg: "image/jpeg",
    	jpeg: "image/jpeg",
    	gif: "image/gif",
    	bmp: "image/bmp",
    	svg: "image/svg+xml",
    	webp: "image/webp"
    };
    
    function get_full_path(file_path) {
    	if (file_path != null && file_path != "") {
    		file_path = String(file_path);
    		var project_directory_path = String(context.getProjectDirectory()).replace(/\\/g, "/") + "/";
    		if (file_path.indexOf(".//") == 0) {
    			file_path = project_directory_path + file_path.substring(3);
    		} else if (file_path.indexOf("./") == 0) {
    			file_path = project_directory_path + "../" + file_path.substring(2);
    		}
    	}
    	return file_path;
    }
    
    function get_file_name(file_path) {
    	if (file_path != null && file_path != "") {
    		return String(org.apache.commons.io.FilenameUtils.getName(get_full_path(file_path)));
    	}
    	return "";
    }
    
    var ODF_TYPES = {
    	odp: "application/vnd.oasis.opendocument.presentation",
    	odt: "application/vnd.oasis.opendocument.text",
    	ods: "application/vnd.oasis.opendocument.spreadsheet",
    	odg: "application/vnd.oasis.opendocument.graphics"
    };
    
    var template_path = get_full_path(input_filename);
    var output_path = get_full_path(output_filename);
    var file_name = get_file_name(output_filename);
    var content_type = ODF_TYPES[file_name.replace(/^.*\./, "").toLowerCase()] || "application/octet-stream";
    
    with (odf_api) {
    
    	/* ---------- Generic value helpers ---------- */
    
    	function isStr(v) {
    		return typeof v == "string" || v instanceof java.lang.String;
    	}
    
    	function isArr(v) {
    		return Array.isArray ? Array.isArray(v) : Object.prototype.toString.call(v) == "[object Array]";
    	}
    
    	function parseJson(v) {
    		if (isStr(v)) {
    			var s = String(v).trim();
    			var c = s.charAt(0);
    			if (c == "[" || c == "{") {
    				try {
    					return JSON.parse(s);
    				} catch (e) {
    					log.warn("[u_fill_odp] Value looks like JSON but cannot be parsed: " + e);
    				}
    			}
    			return String(v);
    		}
    		return v;
    	}
    
    	function asArray(v) {
    		v = parseJson(v);
    		if (v == null) return [];
    		if (isArr(v)) return v;
    		if (v instanceof java.util.List) {
    			var l = [];
    			for (var i = 0; i < v.size(); i++) l.push(v.get(i));
    			return l;
    		}
    		if (v instanceof java.lang.Object && v.getClass().isArray()) {
    			var a = [];
    			for (var j = 0; j < v.length; j++) a.push(v[j]);
    			return a;
    		}
    		if (typeof v == "object" && v.array != null) return asArray(v.array);
    		return [v];
    	}
    
    	function toText(v) {
    		if (v == null) return "";
    		if (isStr(v) || typeof v == "number" || typeof v == "boolean") return String(v);
    		if (v instanceof java.lang.Object) return String(v.toString());
    		return JSON.stringify(v);
    	}
    
    	/* ---------- DOM helpers ---------- */
    
    	function isEl(n, ns, local) {
    		return n != null && n.getNodeType() == 1 && String(n.getNamespaceURI()) == ns && String(n.getLocalName()) == local;
    	}
    
    	function isParagraph(n) {
    		return isEl(n, NS.text, "p") || isEl(n, NS.text, "h");
    	}
    
    	function descendants(root, ns, local) {
    		var out = [];
    		if (isEl(root, ns, local)) out.push(root);
    		var list = root.getElementsByTagNameNS(ns, local);
    		for (var i = 0; i < list.getLength(); i++) out.push(list.item(i));
    		return out;
    	}
    
    	function paragraphsOf(scopes) {
    		var out = [];
    		for (var i = 0; i < scopes.length; i++) {
    			out = out.concat(descendants(scopes[i], NS.text, "p"), descendants(scopes[i], NS.text, "h"));
    		}
    		return out;
    	}
    
    	function ancestor(node, ns, local) {
    		var n = node.getParentNode();
    		while (n != null && n.getNodeType() == 1) {
    			if (isEl(n, ns, local)) return n;
    			n = n.getParentNode();
    		}
    		return null;
    	}
    
    	function isAttached(node) {
    		var n = node;
    		while (n != null) {
    			if (n.getNodeType() == 9) return true;
    			n = n.getParentNode();
    		}
    		return false;
    	}
    
    	function childElements(node, ns, local) {
    		var out = [];
    		for (var c = node.getFirstChild(); c != null; c = c.getNextSibling()) {
    			if (isEl(c, ns, local)) out.push(c);
    		}
    		return out;
    	}
    
    	function insertAfter(ref, nodes) {
    		var parent = ref.getParentNode();
    		var next = ref.getNextSibling();
    		for (var i = 0; i < nodes.length; i++) parent.insertBefore(nodes[i], next);
    	}
    
    	/* ---------- Paragraph text model ----------
    	 * A paragraph text is the concatenation of its text nodes, nested spans included.
    	 * text:s / text:tab / text:line-break count as one separator char that can not match
    	 * a tag. Nested paragraphs, frames, notes and annotations are not part of the text. */
    
    	var SEP = "\u0000";
    
    	function collectSegments(node, segs) {
    		for (var c = node.getFirstChild(); c != null; c = c.getNextSibling()) {
    			var t = c.getNodeType();
    			if (t == 3 || t == 4) {
    				segs.push({ node: c, text: String(c.getData()) });
    			} else if (t == 1) {
    				if (isParagraph(c) || isEl(c, NS.draw, "frame") || isEl(c, NS.text, "note") || isEl(c, NS.office, "annotation")) continue;
    				if (isEl(c, NS.text, "s") || isEl(c, NS.text, "tab") || isEl(c, NS.text, "line-break")) {
    					segs.push({ node: null, element: c, text: SEP });
    					continue;
    				}
    				collectSegments(c, segs);
    			}
    		}
    		return segs;
    	}
    
    	function paragraphText(p) {
    		var segs = collectSegments(p, []);
    		var s = "";
    		for (var i = 0; i < segs.length; i++) s += segs[i].text;
    		return s;
    	}
    
    	function containsTag(p, tag) {
    		return paragraphText(p).indexOf(tag) != -1;
    	}
    
    	/* Builds the ODF nodes for a text value: "\n" -> text:line-break, "\t" -> text:tab,
    	 * runs of spaces -> text:s. Returns { nodes, length } where length is the size of the
    	 * inserted content in the paragraph text model. */
    	function textNodes(doc, value) {
    		var nodes = [];
    		var length = 0;
    		var lines = toText(value).replace(/\r\n?/g, "\n").split("\n");
    		for (var l = 0; l < lines.length; l++) {
    			if (l > 0) {
    				nodes.push(doc.createElementNS(NS.text, "text:line-break"));
    				length++;
    			}
    			var chunks = lines[l].split("\t");
    			for (var c = 0; c < chunks.length; c++) {
    				if (c > 0) {
    					nodes.push(doc.createElementNS(NS.text, "text:tab"));
    					length++;
    				}
    				var s = chunks[c];
    				var re = / {2,}/g;
    				var last = 0;
    				var m;
    				while ((m = re.exec(s)) != null) {
    					nodes.push(doc.createTextNode(s.substring(last, m.index + 1)));
    					length += m.index + 1 - last;
    					var sp = doc.createElementNS(NS.text, "text:s");
    					if (m[0].length > 2) sp.setAttributeNS(NS.text, "text:c", String(m[0].length - 1));
    					nodes.push(sp);
    					length++;
    					last = m.index + m[0].length;
    				}
    				if (last < s.length) {
    					nodes.push(doc.createTextNode(s.substring(last)));
    					length += s.length - last;
    				}
    			}
    		}
    		return { nodes: nodes, length: length };
    	}
    
    	/* Replaces every occurrence of tag in paragraph p. The tag may be split across several
    	 * spans: the replacement takes the formatting of the first character of the tag.
    	 * builder(doc) returns { nodes, length }. Returns the number of replacements. */
    	function replaceInParagraph(p, tag, builder) {
    		var count = 0;
    		var from = 0;
    		var doc = p.getOwnerDocument();
    		while (true) {
    			var segs = collectSegments(p, []);
    			var full = "";
    			for (var i = 0; i < segs.length; i++) {
    				segs[i].start = full.length;
    				full += segs[i].text;
    			}
    			var idx = full.indexOf(tag, from);
    			if (idx == -1) break;
    			var end = idx + tag.length;
    			var a = null;
    			var b = null;
    			var middle = [];
    			for (var k = 0; k < segs.length; k++) {
    				var sg = segs[k];
    				var sgEnd = sg.start + sg.text.length;
    				if (a == null && idx >= sg.start && idx < sgEnd) a = sg;
    				if (a != null && end > sg.start && end <= sgEnd) {
    					b = sg;
    					break;
    				}
    				if (a != null && sg !== a) middle.push(sg);
    			}
    			var prefix = a.text.substring(0, idx - a.start);
    			var suffix = b.text.substring(end - b.start);
    			var anchor = a.node;
    			if (a === b) {
    				anchor.setData(prefix);
    				if (suffix != "") insertAfter(anchor, [doc.createTextNode(suffix)]);
    			} else {
    				anchor.setData(prefix);
    				for (var mi = 0; mi < middle.length; mi++) {
    					if (middle[mi].node != null) middle[mi].node.setData("");
    				}
    				b.node.setData(suffix);
    			}
    			var built = builder(doc);
    			insertAfter(anchor, built.nodes);
    			removeIfEmpty(anchor);
    			for (var ei = 0; ei < middle.length; ei++) {
    				if (middle[ei].node != null) removeIfEmpty(middle[ei].node);
    			}
    			if (b !== a) removeIfEmpty(b.node);
    			count++;
    			from = idx + built.length;
    		}
    		return count;
    	}
    
    	/* Removes an emptied text node and the spans left without content. */
    	function removeIfEmpty(textNode) {
    		if (String(textNode.getData()) != "" || textNode.getParentNode() == null) return;
    		var parent = textNode.getParentNode();
    		parent.removeChild(textNode);
    		while (isEl(parent, NS.text, "span") && parent.getFirstChild() == null) {
    			var up = parent.getParentNode();
    			up.removeChild(parent);
    			parent = up;
    		}
    	}
    
    	function replaceText(scopes, tag, value) {
    		var count = 0;
    		var paragraphs = paragraphsOf(scopes);
    		for (var i = 0; i < paragraphs.length; i++) {
    			if (containsTag(paragraphs[i], tag)) {
    				count += replaceInParagraph(paragraphs[i], tag, function (doc) {
    					return textNodes(doc, value);
    				});
    			}
    		}
    		return count;
    	}
    
    	/* Sets the whole text of a paragraph, keeping the formatting of its first text run. */
    	function setParagraphText(p, value) {
    		var doc = p.getOwnerDocument();
    		var segs = collectSegments(p, []);
    		var first = null;
    		var emptied = [];
    		for (var i = 0; i < segs.length; i++) {
    			if (segs[i].node == null) {
    				segs[i].element.getParentNode().removeChild(segs[i].element);
    			} else if (first == null) {
    				first = segs[i].node;
    			} else {
    				segs[i].node.setData("");
    				emptied.push(segs[i].node);
    			}
    		}
    		var built = textNodes(doc, value);
    		if (first != null) {
    			first.setData("");
    			insertAfter(first, built.nodes);
    			if (built.nodes.length > 0) removeIfEmpty(first);
    			for (var e = 0; e < emptied.length; e++) removeIfEmpty(emptied[e]);
    		} else {
    			var host = p;
    			var spans = p.getElementsByTagNameNS(NS.text, "span");
    			if (spans.getLength() > 0) host = spans.item(0);
    			for (var n = 0; n < built.nodes.length; n++) host.appendChild(built.nodes[n]);
    		}
    	}
    
    	/* ---------- list ---------- */
    
    	function processList(scopes, marker) {
    		var values = asArray(marker.value);
    		var count = 0;
    		var targets = paragraphsOf(scopes).filter(function (p) {
    			return containsTag(p, marker.tag);
    		});
    		for (var i = 0; i < targets.length; i++) {
    			var p = targets[i];
    			if (!isAttached(p)) continue;
    			var unit = isEl(p.getParentNode(), NS.text, "list-item") ? p.getParentNode() : p;
    			var parent = unit.getParentNode();
    			for (var v = 0; v < values.length; v++) {
    				var copy = unit.cloneNode(true);
    				parent.insertBefore(copy, unit);
    				replaceText([copy], marker.tag, values[v]);
    			}
    			parent.removeChild(unit);
    			if (isEl(parent, NS.text, "list") && childElements(parent, NS.text, "list-item").length == 0) {
    				parent.getParentNode().removeChild(parent);
    			}
    			count++;
    		}
    		return count;
    	}
    
    	/* ---------- rows ---------- */
    
    	function setCellValue(cell, value, modelParagraph) {
    		var paragraphs = childElements(cell, NS.text, "p").concat(childElements(cell, NS.text, "h"));
    		var p;
    		if (paragraphs.length == 0) {
    			p = modelParagraph.cloneNode(true);
    			cell.appendChild(p);
    		} else {
    			p = paragraphs[0];
    			for (var i = 1; i < paragraphs.length; i++) cell.removeChild(paragraphs[i]);
    		}
    		setParagraphText(p, value);
    		// Spreadsheet cells also carry a typed value that LibreOffice displays first.
    		if (cell.hasAttributeNS(NS.office, "value-type")) {
    			var numeric = typeof value == "number" || (isStr(value) && /^-?[0-9]+([.][0-9]+)?$/.test(String(value)));
    			var vt = String(cell.getAttributeNS(NS.office, "value-type"));
    			var keepNumeric = numeric && (vt == "float" || vt == "percentage" || vt == "currency");
    			var newType = keepNumeric ? vt : "string";
    			cell.setAttributeNS(NS.office, "office:value-type", newType);
    			if (keepNumeric) {
    				cell.setAttributeNS(NS.office, "office:value", String(value));
    			} else {
    				cell.removeAttributeNS(NS.office, "value");
    			}
    			if (cell.hasAttributeNS(NS.calcext, "value-type")) cell.setAttributeNS(NS.calcext, "calcext:value-type", newType);
    		}
    	}
    
    	/* Spreadsheets compress identical adjacent cells with table:number-columns-repeated.
    	 * Splits them so that the first "needed" columns are individual cells. */
    	function expandRepeatedCells(row, needed) {
    		var pos = 0;
    		var cell = row.getFirstChild();
    		while (cell != null && pos < needed) {
    			var next = cell.getNextSibling();
    			if (isEl(cell, NS.table, "table-cell") || isEl(cell, NS.table, "covered-table-cell")) {
    				var repeat = parseInt(String(cell.getAttributeNS(NS.table, "number-columns-repeated")), 10);
    				if (repeat > 1) {
    					var individual = Math.min(repeat, needed - pos);
    					cell.removeAttributeNS(NS.table, "number-columns-repeated");
    					for (var k = 1; k < individual; k++) row.insertBefore(cell.cloneNode(true), next);
    					if (repeat > individual) {
    						var rest = cell.cloneNode(true);
    						rest.setAttributeNS(NS.table, "table:number-columns-repeated", String(repeat - individual));
    						row.insertBefore(rest, next);
    					}
    					pos += individual;
    				} else {
    					pos++;
    				}
    			}
    			cell = next;
    		}
    	}
    
    	function processRows(scopes, marker) {
    		var rows = asArray(marker.value);
    		var count = 0;
    		var targets = paragraphsOf(scopes).filter(function (p) {
    			return containsTag(p, marker.tag);
    		});
    		for (var i = 0; i < targets.length; i++) {
    			var p = targets[i];
    			if (!isAttached(p)) continue;
    			var row = ancestor(p, NS.table, "table-row");
    			if (row == null) {
    				log.warn("[u_fill_odp] rows tag ''" + marker.tag + "'' is not inside a table row, tag removed");
    				replaceText([p], marker.tag, "");
    				continue;
    			}
    			var parent = row.getParentNode();
    			for (var r = 0; r < rows.length; r++) {
    				var values = asArray(rows[r]);
    				var copy = row.cloneNode(true);
    				copy.removeAttributeNS(NS.table, "number-rows-repeated");
    				parent.insertBefore(copy, row);
    				expandRepeatedCells(copy, values.length);
    				var c = 0;
    				for (var cell = copy.getFirstChild(); cell != null; cell = cell.getNextSibling()) {
    					if (isEl(cell, NS.table, "table-cell")) {
    						if (c < values.length) setCellValue(cell, values[c], p);
    						c++;
    					} else if (isEl(cell, NS.table, "covered-table-cell")) {
    						c++;
    					}
    				}
    				replaceText([copy], marker.tag, "");
    			}
    			parent.removeChild(row);
    			// Impress stores a picture preview of the table that becomes stale once modified.
    			var frame = ancestor(parent, NS.draw, "frame");
    			if (frame != null) {
    				var previews = childElements(frame, NS.draw, "image");
    				for (var pv = 0; pv < previews.length; pv++) frame.removeChild(previews[pv]);
    			}
    			count++;
    		}
    		return count;
    	}
    
    	/* ---------- image ---------- */
    
    	var imageCache = {};
    	var imageIndex = 0;
    
    	function loadImage(doc, value, tag) {
    		var src = toText(value);
    		if (imageCache[src]) return imageCache[src];
    		var bytes = null;
    		var ext = null;
    		var m = /^data:image\/([a-z0-9.+-]+);base64,(.*)$/i.exec(src);
    		if (m) {
    			ext = m[1].toLowerCase().replace("svg+xml", "svg").replace("jpeg", "jpg");
    			bytes = java.util.Base64.getMimeDecoder().decode(m[2]);

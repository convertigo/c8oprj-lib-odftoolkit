    [ { "tag": "{titre}", "type": "string", "value": "..." }, ... ] 
    Types: 
    - string (default): text, \n = line break, \t = tab. 
    - list: value = array of strings, the paragraph or list item holding the tag is repeated. 
    - rows: value = array of rows (arrays of cell values), the table row holding the tag is repeated. 
    - image: value = image path or data URI; tag = frame name, or text frame holding only the tag. Option fit = contain (default) or stretch. 
    - slides: value = array of items (array of markers, or object with a markers array), the slide holding the tag is repeated and each item markers apply to its copy. 
    Look at demo_u_fill_odp for a complete example.'

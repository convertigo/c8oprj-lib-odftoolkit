    			try {
    				var calendar = new java.util.GregorianCalendar();
    				if (String(meta_creation_date) != "now") {
    					var formatter = new java.text.SimpleDateFormat("yyyy-MM-dd''T''HH:mm:ss");
    					calendar.setTime(formatter.parse(String(meta_creation_date)));
    				}
    				meta.setCreationDate(calendar);
    			} catch (e) {
    				log.error(LOG + "Can not parse meta_creation_date ''" + meta_creation_date + "'': " + e);
    			}
    		}
    	}
    
    	/* ---------- Main ---------- */
    
    	var document = null;
    	try {
    		var templateFile = new File(template_path);
    		if (!templateFile.isFile()) throw "Template file not found: " + template_path;
    		var markers = asArray(typeof o_markers != "undefined" ? o_markers : null);
    		document = OdfDocument.loadDocument(template_path);
    		docRef = document;
    		var scopes = [document.getContentDom().getDocumentElement(), document.getStylesDom().getDocumentElement()];
    		var initialHrefs = collectHrefs(document);
    		processMarkers(scopes, markers, true);
    		removeOrphanPictures(document, initialHrefs);
    		applyMetadata(document);
    		var outputFile = new File(output_path);
    		if (outputFile.getAbsoluteFile().getParentFile() != null) outputFile.getAbsoluteFile().getParentFile().mkdirs();
    		document.save(output_path);
    		if (String(delete_at_end_of_session) != "false") context.addFileToDeleteAtEndOfSession(outputFile);
    		if (not_found.length > 0) log.warn(LOG + "Tags not found in template: " + not_found.join(", "));
    	} catch (e) {
    		log.error(LOG + "Error filling ''" + template_path + "'': " + e);
    		_error = true;
    		_error_msg = "ERROR: filling template ''" + template_path + "''";
    		_error_stack = "" + e;
    	} finally {
    		if (document != null) document.close();
    	}

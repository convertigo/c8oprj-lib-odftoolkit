↓fill_template [steps.SimpleStep-1739960996675]: 
  expression: |
    '/* =====================================================================================
     * u_fill_odt / SimpleStep "fill_template"
     *
     * Fills an OpenDocument template (ODT text, ODS spreadsheet or ODP presentation) by
     * replacing tags in the body, headers/footers, master pages, notes and tables.
     * The engine works on the ODF XML (content.xml + styles.xml) through the ODFDOM core API
     * (odfdom-java 0.13: OdfDocument.loadDocument, getContentDom, getStylesDom,
     * getPackage().insert/remove, getOfficeMetadata, save) and the W3C DOM. It does not use
     * the Simple API (org.odftoolkit.simple.*) that is not maintained anymore.
     *
     * A tag may be split across several spans by the editor: it is still found, and the
     * replacement takes the formatting of the first character of the tag.
     *
     * Marker types ("slides" first, then "rows" / "list", then the others, in array order):
     *   string, paragraph (default) : text; "\n" = line break, "\t" = tab.
     *   newline : line break.
     *   span    : text with "style": { fontName, fontStyle (REGULAR, BOLD, ITALIC,
     *             BOLDITALIC), fontSize, fontColor (name or #rrggbb) }.
     *   image   : value = image path or data URI. The tag is the name of a frame, or a text
     *             frame holding only the tag (the frame becomes the picture), or a text tag
     *             (inline picture in text documents). Options: fit = contain (default) or
     *             stretch, width / height (for example "4cm") for inline pictures.
     *   table, tableh : value = 2D array. Builds a table in place of the tag ("tableh": first
     *             row is a header). "style": { header, defaults, cells: { "row-col": {...} } }
     *             with fontName, fontStyle, fontSize, fontColor, cellHAlign, cellVAlign,
     *             cellBGColor. "merges": [ { row, col, rowspan, colspan } ].
     *   tablet  : same as table, cell styles taken from the 1x3 table "table_template_name"
     *             of "table_template_file" (header, even and odd rows).
     *   array   : value = array of markers without tag, inserted one after the other.
     *   list    : value = array of strings, the paragraph (or list item) is repeated.
     *   rows    : value = 2D array, the table row holding the tag is repeated.
     *   slides  : value = array of items (array of markers or { markers: [...] }), the slide
     *             holding the tag is repeated and each item markers apply to its copy.
     * ===================================================================================== */
    
    var odf_api = JavaImporter(
    	Packages.org.odftoolkit.odfdom.doc.OdfDocument,
    	java.io.File,
    	java.io.ByteArrayInputStream,
    	java.nio.file.Files,
    	java.util.ArrayList,
    	java.util.UUID,
    	javax.imageio.ImageIO
    );
    
    var _error = false;
    var _error_code = "-1";
    var _error_msg = "";
    var _error_stack = "";
    var not_found = [];
    var marker_errors = [];
    
    var LOG = "[u_fill_odt] ";
    
    var NS = {
    	office: "urn:oasis:names:tc:opendocument:xmlns:office:1.0",
    	style: "urn:oasis:names:tc:opendocument:xmlns:style:1.0",
    	text: "urn:oasis:names:tc:opendocument:xmlns:text:1.0",
    	draw: "urn:oasis:names:tc:opendocument:xmlns:drawing:1.0",
    	table: "urn:oasis:names:tc:opendocument:xmlns:table:1.0",
    	fo: "urn:oasis:names:tc:opendocument:xmlns:xsl-fo-compatible:1.0",
    	svg: "urn:oasis:names:tc:opendocument:xmlns:svg-compatible:1.0",
    	xlink: "http://www.w3.org/1999/xlink",
    	xml: "http://www.w3.org/XML/1998/namespace",
    	presentation: "urn:oasis:names:tc:opendocument:xmlns:presentation:1.0",
    	calcext: "urn:org:documentfoundation:names:experimental:calc:xmlns:calcext:1.0"
    };
    
    var IMAGE_TYPES = {
    	png: "image/png",
    	jpg: "image/jpeg",
    	jpeg: "image/jpeg",
    	gif: "image/gif",
    	bmp: "image/bmp",
    	svg: "image/svg+xml",
    	webp: "image/webp"
    };
    
    var COLORS = {
    	AQUA: "#00ffff", BLACK: "#000000", BLUE: "#0000ff", FUCHSIA: "#ff00ff", GRAY: "#808080",
    	GREEN: "#008000", LIME: "#00ff00", MAROON: "#800000", NAVY: "#000080", OLIVE: "#808000",
    	ORANGE: "#ffa500", PURPLE: "#800080", RED: "#ff0000", SILVER: "#c0c0c0", TEAL: "#008080",
    	WHITE: "#ffffff", YELLOW: "#ffff00"
    };
    
    var H_ALIGN = { CENTER: "center", JUSTIFY: "justify", FILLED: "justify", LEFT: "left", RIGHT: "right" };
    var V_ALIGN = { TOP: "top", MIDDLE: "middle", BOTTOM: "bottom" };
    
    // Same defaults as the previous Simple API implementation.
    var DEFAULT_FONT = { fontName: "Arial", fontStyle: "REGULAR", fontSize: 10, fontColor: "BLACK" };
    var CELL_BORDER = "0.0007in solid #000000";
    var MERGED_BORDER = "0.5pt solid #000000";
    var CELL_PADDING = "0.0382in";
    var CM_PER_PIXEL = 0.028;
    
    function get_full_path(file_path) {
    	if (file_path != null && file_path != "") {
    		file_path = String(file_path);
    		var project_directory_path = String(context.getProjectDirectory()).replace(/\\/g, "/") + "/";
    		if (file_path.indexOf(".//") == 0) {
    			file_path = project_directory_path + file_path.substring(3);
    		} else if (file_path.indexOf("./") == 0) {
    			file_path = project_directory_path + "../" + file_path.substring(2);
    		}
    	}
    	return file_path;
    }
    
    function get_file_name(file_path) {
    	if (file_path != null && file_path != "") {
    		return String(org.apache.commons.io.FilenameUtils.getName(get_full_path(file_path)));
    	}
    	return "";
    }
    
    var template_path = get_full_path(input_filename);
    var output_path = get_full_path(output_filename);
    var file_name = get_file_name(output_filename);
    
    with (odf_api) {
    
    	var docRef = null;
    	var uniq = 0;
    
    	/* ---------- Generic value helpers ---------- */
    
    	function isStr(v) {
    		return typeof v == "string" || v instanceof String || v instanceof java.lang.String;
    	}
    
    	function isArr(v) {
    		return Array.isArray ? Array.isArray(v) : Object.prototype.toString.call(v) == "[object Array]";
    	}
    
    	function parseJson(v) {
    		if (isStr(v)) {
    			var s = String(v).trim();
    			var c = s.charAt(0);
    			if (c == "[" || c == "{") {
    				try {
    					return JSON.parse(s);
    				} catch (e) {
    					log.warn(LOG + "Value looks like JSON but cannot be parsed: " + e);
    				}
    			}
    			return String(v);
    		}
    		return v;
    	}
    
    	function asArray(v) {
    		v = parseJson(v);
    		if (v == null) return [];
    		if (isArr(v)) return v;
    		if (v instanceof java.util.List) {
    			var l = [];
    			for (var i = 0; i < v.size(); i++) l.push(v.get(i));
    			return l;
    		}
    		if (v instanceof java.lang.Object && v.getClass().isArray()) {
    			var a = [];
    			for (var j = 0; j < v.length; j++) a.push(v[j]);
    			return a;
    		}
    		if (typeof v == "object" && v.array != null) return asArray(v.array);
    		return [v];
    	}
    
    	function asObject(v) {
    		v = parseJson(v);
    		return v != null && typeof v == "object" && !isArr(v) && !(v instanceof java.lang.Object) ? v : {};
    	}
    
    	function toText(v) {
    		if (v == null) return "";
    		if (isStr(v) || typeof v == "number" || typeof v == "boolean" || v instanceof Number || v instanceof Boolean) return String(v);
    		if (v instanceof java.lang.Object) return String(v.toString());
    		return JSON.stringify(v);
    	}
    
    	function toInt(v, def) {
    		var n = parseInt(toText(v), 10);
    		return isNaN(n) ? def : n;
    	}
    
    	/* ---------- DOM helpers ---------- */
    
    	function isEl(n, ns, local) {
    		return n != null && n.getNodeType() == 1 && String(n.getNamespaceURI()) == ns && String(n.getLocalName()) == local;
    	}
    
    	function isParagraph(n) {
    		return isEl(n, NS.text, "p") || isEl(n, NS.text, "h");
    	}
    
    	function attr(el, ns, local) {
    		return el != null && el.hasAttributeNS(ns, local) ? String(el.getAttributeNS(ns, local)) : "";
    	}
    
    	function descendants(root, ns, local) {
    		var out = [];
    		if (isEl(root, ns, local)) out.push(root);
    		var list = root.getElementsByTagNameNS(ns, local);
    		for (var i = 0; i < list.getLength(); i++) out.push(list.item(i));
    		return out;
    	}
    
    	/* Paragraphs (text:p and text:h) in document order. */
    	function paragraphsOf(scopes) {
    		var out = [];
    		for (var i = 0; i < scopes.length; i++) {
    			if (isParagraph(scopes[i])) out.push(scopes[i]);
    			var list = scopes[i].getElementsByTagNameNS(NS.text, "*");
    			for (var j = 0; j < list.getLength(); j++) {
    				if (isParagraph(list.item(j))) out.push(list.item(j));
    			}
    		}
    		return out;
    	}
    
    	function ancestor(node, ns, local) {
    		var n = node.getParentNode();
    		while (n != null && n.getNodeType() == 1) {
    			if (isEl(n, ns, local)) return n;
    			n = n.getParentNode();
    		}
    		return null;
    	}
    
    	function isAttached(node) {
    		var n = node;
    		while (n != null) {
    			if (n.getNodeType() == 9) return true;
    			n = n.getParentNode();
    		}
    		return false;
    	}
    
    	function childElements(node, ns, local) {
    		var out = [];
    		for (var c = node.getFirstChild(); c != null; c = c.getNextSibling()) {
    			if (isEl(c, ns, local)) out.push(c);
    		}
    		return out;
    	}
    
    	function insertAfter(ref, nodes) {
    		var parent = ref.getParentNode();
    		var next = ref.getNextSibling();
    		for (var i = 0; i < nodes.length; i++) parent.insertBefore(nodes[i], next);
    	}
    
    	function bodyKind() {
    		var body = docRef.getContentDom().getElementsByTagNameNS(NS.office, "body");
    		if (body.getLength() > 0) {
    			for (var c = body.item(0).getFirstChild(); c != null; c = c.getNextSibling()) {
    				if (c.getNodeType() == 1) return String(c.getLocalName());
    			}
    		}
    		return "";
    	}
    
    	/* ---------- Paragraph text model ----------
    	 * A paragraph text is the concatenation of its text nodes, nested spans included.
    	 * text:s / text:tab / text:line-break count as one separator char that can not match
    	 * a tag. Nested paragraphs, frames, notes and annotations are not part of the text. */
    
    	var SEP = "\u0000";
    
    	function collectSegments(node, segs) {
    		for (var c = node.getFirstChild(); c != null; c = c.getNextSibling()) {
    			var t = c.getNodeType();
    			if (t == 3 || t == 4) {
    				segs.push({ node: c, text: String(c.getData()) });
    			} else if (t == 1) {
    				if (isParagraph(c) || isEl(c, NS.draw, "frame") || isEl(c, NS.text, "note") || isEl(c, NS.office, "annotation")) continue;
    				if (isEl(c, NS.text, "s") || isEl(c, NS.text, "tab") || isEl(c, NS.text, "line-break")) {
    					segs.push({ node: null, element: c, text: SEP });
    					continue;
    				}
    				collectSegments(c, segs);
    			}
    		}
    		return segs;
    	}
    
    	function paragraphText(p) {
    		var segs = collectSegments(p, []);
    		var s = "";
    		for (var i = 0; i < segs.length; i++) s += segs[i].text;
    		return s;
    	}
    
    	/* Text of every paragraph of a frame (odfdom 0.13 returns "" for getTextContent() on
    	 * non paragraph elements, so the DOM text is never read through it). */
    	function frameText(frame) {
    		var paragraphs = paragraphsOf([frame]);
    		var s = "";
    		for (var i = 0; i < paragraphs.length; i++) s += paragraphText(paragraphs[i]).replace(/\u0000/g, " ");
    		return s;
    	}
    
    	function containsTag(p, tag) {
    		return paragraphText(p).indexOf(tag) != -1;
    	}
    
    	function withTag(scopes, tag) {
    		return paragraphsOf(scopes).filter(function (p) {
    			return containsTag(p, tag);
    		});
    	}
    
    	/* Builds the ODF nodes for a text value: "\n" -> text:line-break, "\t" -> text:tab,
    	 * runs of spaces -> text:s. Returns { nodes, length } where length is the size of the
    	 * inserted content in the paragraph text model. */
    	function textNodes(doc, value) {
    		var nodes = [];
    		var length = 0;
    		var lines = toText(value).replace(/\r\n?/g, "\n").split("\n");
    		for (var l = 0; l < lines.length; l++) {
    			if (l > 0) {
    				nodes.push(doc.createElementNS(NS.text, "text:line-break"));
    				length++;
    			}
    			var chunks = lines[l].split("\t");
    			for (var c = 0; c < chunks.length; c++) {
    				if (c > 0) {
    					nodes.push(doc.createElementNS(NS.text, "text:tab"));
    					length++;
    				}
    				var s = chunks[c];
    				var re = / {2,}/g;
    				var last = 0;
    				var m;
    				while ((m = re.exec(s)) != null) {
    					nodes.push(doc.createTextNode(s.substring(last, m.index + 1)));
    					length += m.index + 1 - last;
    					var sp = doc.createElementNS(NS.text, "text:s");
    					if (m[0].length > 2) sp.setAttributeNS(NS.text, "text:c", String(m[0].length - 1));
    					nodes.push(sp);
    					length++;
    					last = m.index + m[0].length;
    				}
    				if (last < s.length) {
    					nodes.push(doc.createTextNode(s.substring(last)));
    					length += s.length - last;
    				}
    			}
    		}
    		return { nodes: nodes, length: length };
    	}
    
    	/* Replaces the occurrences of tag in paragraph p (at most "max" when given). The tag
    	 * may be split across several spans: the replacement takes the formatting of the
    	 * first character of the tag. builder(doc) returns { nodes, length }. */
    	function replaceInParagraph(p, tag, builder, max) {
    		var count = 0;
    		var from = 0;
    		var doc = p.getOwnerDocument();
    		while (max == null || count < max) {
    			var segs = collectSegments(p, []);
    			var full = "";
    			for (var i = 0; i < segs.length; i++) {
    				segs[i].start = full.length;
    				full += segs[i].text;
    			}
    			var idx = full.indexOf(tag, from);
    			if (idx == -1) break;
    			var end = idx + tag.length;
    			var a = null;
    			var b = null;
    			var middle = [];
    			for (var k = 0; k < segs.length; k++) {
    				var sg = segs[k];
    				var sgEnd = sg.start + sg.text.length;
    				if (a == null && idx >= sg.start && idx < sgEnd) a = sg;
    				if (a != null && end > sg.start && end <= sgEnd) {
    					b = sg;
    					break;
    				}
    				if (a != null && sg !== a) middle.push(sg);
    			}
    			var prefix = a.text.substring(0, idx - a.start);
    			var suffix = b.text.substring(end - b.start);
    			var anchor = a.node;
    			if (a === b) {
    				anchor.setData(prefix);
    				if (suffix != "") insertAfter(anchor, [doc.createTextNode(suffix)]);
    			} else {
    				anchor.setData(prefix);
    				for (var mi = 0; mi < middle.length; mi++) {
    					if (middle[mi].node != null) middle[mi].node.setData("");
    				}
    				b.node.setData(suffix);
    			}
    			var built = builder(doc);
    			insertAfter(anchor, built.nodes);
    			removeIfEmpty(anchor);
    			for (var ei = 0; ei < middle.length; ei++) {
    				if (middle[ei].node != null) removeIfEmpty(middle[ei].node);
    			}
    			if (b !== a) removeIfEmpty(b.node);
    			count++;
    			from = idx + built.length;
    		}
    		return count;
    	}
    
    	/* Removes an emptied text node and the spans left without content. */
    	function removeIfEmpty(textNode) {
    		if (String(textNode.getData()) != "" || textNode.getParentNode() == null) return;
    		var parent = textNode.getParentNode();
    		parent.removeChild(textNode);
    		while (isEl(parent, NS.text, "span") && parent.getFirstChild() == null) {
    			var up = parent.getParentNode();
    			up.removeChild(parent);
    			parent = up;
    		}
    	}
    
    	function replaceText(scopes, tag, value) {
    		var count = 0;
    		var paragraphs = withTag(scopes, tag);
    		for (var i = 0; i < paragraphs.length; i++) {
    			count += replaceInParagraph(paragraphs[i], tag, function (doc) {
    				return textNodes(doc, value);
    			});
    		}
    		return count;
    	}
    
    	/* Sets the whole text of a paragraph, keeping the formatting of its first text run. */
    	function setParagraphText(p, value) {
    		var doc = p.getOwnerDocument();
    		var segs = collectSegments(p, []);
    		var first = null;
    		var emptied = [];
    		for (var i = 0; i < segs.length; i++) {
    			if (segs[i].node == null) {
    				segs[i].element.getParentNode().removeChild(segs[i].element);
    			} else if (first == null) {
    				first = segs[i].node;
    			} else {
    				segs[i].node.setData("");
    				emptied.push(segs[i].node);
    			}
    		}
    		var built = textNodes(doc, value);
    		if (first != null) {
    			first.setData("");
    			insertAfter(first, built.nodes);
    			if (built.nodes.length > 0) removeIfEmpty(first);
    			for (var e = 0; e < emptied.length; e++) removeIfEmpty(emptied[e]);
    		} else {

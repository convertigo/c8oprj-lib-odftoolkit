  expression: |
    '/* =====================================================================================
     * u_fill_odt / SimpleStep "fill_template" - EVOLUTIONS UPSTREAM 1.11.5
     * Projet Convertigo : lib_fill_odt_pdf (upstream : convertigo/c8oprj-lib-odftoolkit)
     *
     * Depuis le tag 1.11.5, les 3 evolutions ci-dessous font partie du code upstream.
     * Elles ne doivent donc plus etre considerees comme des patches locaux a reappliquer.
     * Les zones concernees sont encadrees par un bloc "UPSTREAM 1.11.5 #n" /
     * "FIN UPSTREAM 1.11.5 #n".
     *
     * -------------------------------------------------------------------------------------
     * UPSTREAM 1.11.5 #1 - Nom de table unique (au lieu de "table1" code en dur)
     *   Emplacement : case "table" / "tableh", creation de la table + item.replaceWith()
     *   Avant 1.11.5 : chaque tableau genere est nomme "table1". Des qu''un document
     *   contient plusieurs tableaux (cas systematique avec un tag de type "array" qui
     *   enchaine plusieurs tableaux), fdoc.getTableByName("table1") devient ambigu et
     *   peut renvoyer un autre tableau que celui qui vient d''etre construit.
     *
     * UPSTREAM 1.11.5 #2 - Support des cellules fusionnees (colspan / rowspan)
     *   Emplacement : case "table" / "tableh", apres la boucle de remplissage
     *   Avant 1.11.5 : aucun support de fusion. L''API Simple ODF n''accepte pas
     *   colspan/rowspan a la creation : il faut construire la grille rectangulaire
     *   complete, puis fusionner apres coup. Lit une nouvelle propriete "merges" du tag.
     *   Contient 2 sous-parties (phase 1 = fusions, phase 2 = bordures) : voir commentaires.
     *
     * UPSTREAM 1.11.5 #3 - Propagation de "merges" dans le case "array"
     *   Emplacement : case "array", construction de subTag
     *   Avant 1.11.5 : subTag est reconstruit champ par champ (tag/type/value/style),
     *   donc toute autre propriete du tag est perdue. Consequence : "merges" n''arrive
     *   jamais au case "table" pour un tableau imbrique dans un "array" -> evolution #2
     *   sans effet dans ce cas (qui est le cas d''usage principal).
     * ===================================================================================== */
    
    var odf_api = JavaImporter(
    	Packages.org.odftoolkit.simple.TextDocument,
    	Packages.org.odftoolkit.simple.meta.Meta,
    	Packages.java.util.Arrays,
    	Packages.org.odftoolkit.simple.common.navigation.TextNavigation,
    	org.odftoolkit.odfdom.dom.style.props,
    	org.odftoolkit.simple.text.Span,
    	Packages.org.odftoolkit.simple.draw.Image,
    	Packages.org.odftoolkit.simple.table.Table,
    	Packages.org.odftoolkit.simple.table.Cell,
    	Packages.org.odftoolkit.simple.style.Font,
    	Packages.org.odftoolkit.simple.style.StyleTypeDefinitions,
    	Packages.org.odftoolkit.odfdom.type.Color,
    	Packages.java.io.File,
    	Packages.java.io.FileInputStream
    );
    
    function get_file_name(file_path) {
    	if (file_path != "") {
    		return org.apache.commons.io.FilenameUtils.getName(get_full_path(file_path));
    	}
    }
    
    function get_full_path(file_path) {
    	if (file_path != "") {
    		project_directory_path = context.getProjectDirectory().replace("\\", "/") + "/";
    		if (file_path.indexOf(".//") != -1) {
    			file_path = project_directory_path + file_path.substring(3);
    		}
    		else if (file_path.indexOf("./") != -1) {
    			file_path = project_directory_path + "../" + file_path.substring(2);
    		}
    	}
    	return file_path;
    }
    
    var template_path = get_full_path(input_filename);
    var output_path = get_full_path(output_filename);
    var file_name = get_file_name(output_filename);
    
    with (odf_api) {
    
    	function objectify(s) {
    		if (typeof s == "string") {
    			try {
    				log.debug(''Try to parse the string as JSON...'');
    				const obj = JSON.parse(s); // Convertir la chaîne en objet JSON
    				// Vérifier toutes les propriétés de l''objet
    				Object.keys(obj).forEach(key => {
    					if (typeof obj[key] == "string") {
    						try {
    							log.debug("Parsing nested JSON for key: " + key);
    							obj[key] = JSON.parse(obj[key]); // Désérialiser la chaîne imbriquée
    						} catch (e) {
    							log.warn("Failed to parse nested JSON for key: " + key + ". Keeping it as a string.");
    						}
    					}
    				});
    				return obj;
    			} catch (e) {
    				log.warn("Failed to parse JSON. Returning the string as is: " + e);
    			}
    		}
    		return s; // Retourner tel quel si ce n''est pas une chaîne JSON valide
    	}
    
    	function setTextFont(style) {
    		try {
    			style = objectify(style);
    			return new Font(style && style.fontName ? style.fontName : "Arial", style && style.fontStyle ? StyleTypeDefinitions.FontStyle[style.fontStyle] : StyleTypeDefinitions.FontStyle.REGULAR, style && style.fontSize ? style.fontSize : 10, style && style.fontColor ? getColor(style.fontColor) : Color.BLACK);
    		} catch (e) {
    			log.warn("Setting Default Font values because: " + e);
    			return new Font("Arial", StyleTypeDefinitions.FontStyle.REGULAR, 10, Color.BLACK);
    		}
    	}
    
    	function getCellFont(style, row, column, isHeader) {
    		style = objectify(style);
    		if (isHeader) {
    			var title = { fontName: style && style.header && style.header.fontName ? style.header.fontName : "Arial", fontStyle: style && style.header && style.header.fontStyle ? style.header.fontStyle : "BOLD", fontSize: style && style.header && style.header.fontSize ? style.header.fontSize : 10, fontColor: style && style.header && style.header.fontColor ? style.header.fontColor : "BLACK" };
    			return setTextFont(title);
    		}
    		const key = row + "-" + column;
    		return setTextFont(style && style.cells && style.cells[key] ? style.cells[key] : style && style.defaults ? style.defaults : {});
    	}
    
    	function getColor(color) {
    		const validColors = ["AQUA", "BLACK", "BLUE", "FUCHSIA", "GRAY", "GREEN", "LIME", "MAROON", "NAVY", "OLIVE", "ORANGE", "PURPLE", "RED", "SILVER", "TEAL", "WHITE", "YELLOW"];
    		return color.startsWith("#") ? Color.valueOf(color) : validColors.includes(color) ? Color[color] : Color.WHITE;
    	}
    
    	function setCellBGColor(cell, color) {
    		cell.setCellBackgroundColor(getColor(color));
    	}
    
    	function setCellAttributes(cell, row, column, isHeader, HAlign, VAlign, style) {
    		// Afficher les logs pour chaque variable
    		log.debug("cell => " + cell);
    		log.debug("row => " + row);
    		log.debug("column => " + column);
    		log.debug("isHeader => " + isHeader);
    
    		// Si ''style'' est un objet, afficher ses propriétés
    		if (style != null && typeof style === "object") {
    			log.debug("style (détails) => " + JSON.stringify(style));
    		} else {
    			log.debug("style n''est pas un objet ou est null.");
    		}
    
    		if (isHeader) {
    			if (style && style.header && HAlign.includes(style.header.cellHAlign)) {
    				log.debug("[header] cellHAlign: " + style.header.cellHAlign);
    				cell.setHorizontalAlignment(StyleTypeDefinitions.HorizontalAlignmentType[style.header.cellHAlign]);
    			} else {
    				log.debug("Setting Header to default HAlign: CENTER");
    				cell.setHorizontalAlignment(StyleTypeDefinitions.HorizontalAlignmentType["CENTER"]);
    			}
    			if (style && style.header && VAlign.includes(style.header.cellVAlign)) {
    				log.debug("[header] cellVAlign: " + style.header.cellVAlign);
    				cell.setVerticalAlignment(StyleTypeDefinitions.VerticalAlignmentType[style.header.cellVAlign]);
    			} else {
    				log.debug("Setting Header to default VAlign: MIDDLE");
    				cell.setVerticalAlignment(StyleTypeDefinitions.VerticalAlignmentType["MIDDLE"]);
    			}
    			if (style && style.header && style.header.cellBGColor) {
    				log.debug("[header] cellBGColor: " + style.header.cellBGColor);
    				setCellBGColor(cell, style.header.cellBGColor);
    			} else {
    				log.warn("Setting Header to default BGColor: #e5e5e5");
    				setCellBGColor(cell, "#e5e5e5");
    			}
    			return;
    		}
    		const key = row + "-" + column;
    		log.debug("Searching Atributes for cell " + key);
    		if (style && style.cells && style.cells[key] && HAlign.includes(style.cells[key].cellHAlign)) {
    			log.debug("[cell] cellHAlign: " + style.cells[key].cellHAlign);
    			cell.setHorizontalAlignment(StyleTypeDefinitions.HorizontalAlignmentType[style.cells[key].cellHAlign]);
    		} else if (style && style.defaults && HAlign.includes(style.defaults.cellHAlign)) {
    			log.debug("[defaults] cellHAlign: " + style.defaults.cellHAlign);
    			cell.setHorizontalAlignment(StyleTypeDefinitions.HorizontalAlignmentType[style.defaults.cellHAlign]);
    		} else {
    			log.debug("No valid attribute found for cellHAlign. Do nothing");
    		}
    
    		if (style && style.cells && style.cells[key] && VAlign.includes(style.cells[key].cellVAlign)) {
    			log.debug("[cell] cellVAlign: " + style.cells[key].cellVAlign);
    			cell.setVerticalAlignment(StyleTypeDefinitions.VerticalAlignmentType[style.cells[key].cellVAlign]);
    		} else if (style && style.defaults && VAlign.includes(style.defaults.cellVAlign)) {
    			log.debug("[defaults] cellVAlign: " + style.defaults.cellVAlign);
    			cell.setVerticalAlignment(StyleTypeDefinitions.VerticalAlignmentType[style.defaults.cellVAlign]);
    		} else {
    			log.debug("No valid attribute found for cellVAlign. Do nothing");
    		}
    
    		if (style && style.cells && style.cells[key] && style.cells[key].cellBGColor) {
    			log.debug("[cell] cellBGColor: " + style.cells[key].cellBGColor);
    			setCellBGColor(cell, style.cells[key].cellBGColor);
    		} else if (style && style.defaults && style.defaults.cellBGColor) {
    			log.debug("[defaults] cellBGColor: " + style.defaults.cellBGColor);
    			setCellBGColor(cell, style.defaults.cellBGColor);
    		} else {
    			log.debug("No valid attribute found for BGColor. Do nothing");
    		}
    	}
    
    	function getCellBorder(cell, borderType) {
    		try {
    			border = cell.getBorder(StyleTypeDefinitions.CellBordersType[borderType]);
    			if (border != null && border.toString().trim() != "") {
    				return border;
    			}
    		} catch (e) {
    			log.error("Error occured getting cell border ''" + borderType + "'' because " + e);
    		}
    		return StyleTypeDefinitions.CellBordersType.NONE
    	}
    
    	function extractTableStyles(cell) {
    		var tb_styles = {
    			cellBGColor: cell.getCellBackgroundColor(),
    			isTextWrapped: cell.isTextWrapped(),
    			horizontal: cell.getParagraphByIndex(0, false).getHorizontalAlignment(),
    			//vertical: cell.getVerticalAlignmentType(),
    			top: getCellBorder(cell, "TOP"),
    			bottom: getCellBorder(cell, "BOTTOM"),
    			left: getCellBorder(cell, "LEFT"),
    			right: getCellBorder(cell, "RIGHT"),
    			font: cell.getParagraphByIndex(0, false).getFont()
    		};
    
    		// Affiche les styles récupérés
    		log.debug("TABLE Styles: " + JSON.stringify(tb_styles, null, 2));
    
    		return tb_styles;
    	}
    	
    	function processTagReplacement(fdoc, tag, item)
    	{
    		switch (tag.type) 
    		{
    			case "image":
    				item.replaceWith(new File(get_full_path(tag.value)).toURI());
    				break;
    			case "tablet":
    				var doc_table_template = TextDocument.loadDocument(get_full_path(table_template_file));
    				var table_template = doc_table_template.getTableByName(table_template_name);
    				var tpl_rows = table_template.getRowCount();
    				var tpl_cols = table_template.getColumnCount();
    				var header_row_style = null;
    				var even_row_style = null;
    				var odd_row_style = null;
    				if (tpl_rows == 3 && tpl_cols == 1) {
    					header_row_style = extractTableStyles(table_template.getCellByPosition(0, 0));
    					even_row_style = extractTableStyles(table_template.getCellByPosition(0, 1));
    					odd_row_style = extractTableStyles(table_template.getCellByPosition(0, 2));
    				} else {
    					log.error("Template table must be a 1*3 table");
    				}
    			case "table":
    			case "tableh":
    				var values = tag.value;
    				var rows = values.length;
    				var cols = values[0].length;
    				var hasRowHeader = tag.type == "tableh";
    				var hasTableTemplate = tag.type == "tablet";
    				var isHeader;
    				const validHAlign = ["CENTER", "DEFAULT", "FILLED", "JUSTIFY", "LEFT", "RIGHT"];
    				const validVAlign = ["TOP", "BOTTOM", "MIDDLE", "DEFAULT"];
    				log.debug("Rows: " + rows);
    				log.debug("Cols: " + cols);
    				log.debug("Has row header? " + hasRowHeader);
    				log.debug("Has table template? " + hasTableTemplate);
    				if (rows > 0 && cols > 0) {
    					table1 = Table.newTable(fdoc, rows, cols);
    
    					// ===== UPSTREAM 1.11.5 #1 : nom de table unique =====
    					// AVANT 1.11.5 : table1.setTableName("table1");
    					//
    					// POURQUOI : le nom "table1" est code en dur. Or un meme document peut
    					// contenir plusieurs tableaux : c''est systematique avec un tag de type
    					// "array", qui rappelle ce meme bloc "case table" pour chaque tableau
    					// rencontre. Deux tableaux nommes "table1" dans le document rendent
    					// fdoc.getTableByName("table1") (plus bas) ambigu : il peut renvoyer le
    					// premier tableau trouve au lieu de celui qui vient d''etre construit,
    					// ce qui insere/style le mauvais tableau selon l''ordre de traitement.
    					var uniqueTableName = "table_" + new Date().getTime() + "_" + Math.floor(Math.random() * 100000);
    					table1.setTableName(uniqueTableName);
    					// ===== FIN UPSTREAM 1.11.5 #1 =====
    
    					for (var r = 0; r < rows; r++) {
    						for (var c = 0; c < cols; c++) {
    							var cell = table1.getCellByPosition(c, r);
    							log.debug("row #" + r);
    							log.debug("col #" + c);
    							log.debug("val: " + values[r][c]);
    							if (!hasTableTemplate) {
    								isHeader = r == 0 && hasRowHeader ? true : false;
    								setCellAttributes(cell, r, c, isHeader, validHAlign, validVAlign, tag.style);
    								cell.setFont(getCellFont(tag.style, r, c, isHeader));
    							} else {
    								if (r == 0) {
    									row_style = header_row_style;
    								} else if (r % 2 === 0) {
    									row_style = even_row_style;
    								} else {
    									row_style = odd_row_style;
    								}
    								cell.setCellBackgroundColor(row_style.cellBGColor);
    								cell.setFont(row_style.font);
    								cell.setHorizontalAlignment(row_style.horizontal);
    							}
    							cell.setStringValue(values[r][c]);
    						}
    					}
    
    					// ===== UPSTREAM 1.11.5 #2 : fusion des cellules (colspan/rowspan) =====
    					// AVANT 1.11.5 : ce bloc n''existe pas du tout (aucun support de fusion).
    					//
    					// POURQUOI : le format de tag JSON ne permet pas d''exprimer colspan/rowspan,
    					// et l''API Simple ODF ne permet pas de creer une table avec des cellules
    					// fusionnees. La seule voie possible est donc :
    					//   1) construire la grille rectangulaire complete (fait ci-dessus),
    					//   2) appliquer les fusions apres coup (ci-dessous).
    					//
    					// NOUVELLE PROPRIETE DE TAG ATTENDUE : "merges", tableau d''objets
    					//   { row: <int>, col: <int>, rowspan: <int>, colspan: <int> }
    					//   ou row/col sont les coordonnees 0-based de la cellule d''ancrage
    					//   (haut-gauche) de la zone a fusionner. Propriete optionnelle : si
    					//   absente, le comportement est identique a 1.11.4.
    					if (tag.merges && tag.merges.length > 0) {
    						log.debug("Applying " + tag.merges.length + " merge(s)");
    
    						// ---- Phase 1 : application des fusions ----
    						// NB : getCellRangeByPosition prend (startCol, startRow, endCol, endRow),
    						// soit colonne PUIS ligne, coherent avec getCellByPosition(c, r) utilise
    						// plus haut. Le try/catch est individuel pour qu''une fusion invalide
    						// (coordonnees hors grille) n''interrompe pas les autres.
    						for (var mi = 0; mi < tag.merges.length; mi++) {
    							var mg = tag.merges[mi];
    							if (mg.rowspan > 1 || mg.colspan > 1) {
    								var endCol = mg.col + mg.colspan - 1;
    								var endRow = mg.row + mg.rowspan - 1;
    								log.debug("Merging cols " + mg.col + "-" + endCol + ", rows " + mg.row + "-" + endRow);
    								try {
    									table1.getCellRangeByPosition(mg.col, mg.row, endCol, endRow).merge();
    								} catch (e) {
    									log.error("Merge failed row=" + mg.row + " col=" + mg.col + ": " + e);
    								}
    							}
    						}
    
    						// ---- Phase 2 : bordures des cellules fusionnees ----
    						// PROBLEME TRAITE ICI : apres merge(), les cellules absorbees deviennent
    						// des <table:covered-table-cell> et ne dessinent plus rien. Seul le style
    						// de la cellule d''ancrage subsiste, et il ne couvre que la largeur/hauteur
    						// d''une cellule : la zone fusionnee apparait donc "ouverte" (bordure
    						// manquante a droite et/ou en bas).
    						//
    						// DEUX PIEGES rencontres et contournes ici, dans cet ordre :
    						//
    						//  (a) INSTANCE DETACHEE. merge() reecrit la structure de la ligne. Un
    						//      objet Cell obtenu depuis l''ancienne instance "table1" apres la
    						//      fusion peut pointer un element hors de l''arbre du document :
    						//      l''ecriture reussit sans exception mais n''a AUCUN effet dans le
    						//      fichier final. D''ou la relecture d''une instance fraiche de la
    						//      table via fdoc.getTableByName(), et une phase 2 separee de la
    						//      phase 1 (toutes les fusions doivent etre faites avant).
    						//
    						//  (b) RACCOURCI fo:border INEFFICACE. Ecrire le raccourci 4 cotes
    						//      (OdfTableCellProperties.Border) ne produit rien de visible : les
    						//      styles crees par Table.newTable() portent deja les attributs par
    						//      cote (fo:border-left/right/top/bottom) et, par la spec ODF, les
    						//      attributs par cote L''EMPORTENT sur le raccourci. Il faut donc
    						//      ecrire explicitement les 4 cotes, comme ci-dessous.
    						//      (Meme constat avec l''API haut niveau Cell.setBorders(ALL_FOUR, ...)
    						//      qui reste sans effet sur une cellule fusionnee.)
    						var freshTable = fdoc.getTableByName(uniqueTableName);
    						for (var mj = 0; mj < tag.merges.length; mj++) {
    							var mg2 = tag.merges[mj];
    							if (mg2.rowspan > 1 || mg2.colspan > 1) {
    								try {
    									var anchorEl = freshTable.getCellByPosition(mg2.col, mg2.row).getOdfElement();
    									// NB : "Unqiue" est une faute de frappe presente dans l''API
    									// odfdom elle-meme (getOrCreateUnqiueAutomaticStyle) : a
    									// ecrire telle quelle, ce n''est pas une coquille locale.
    									var anchorStyle = anchorEl.getOrCreateUnqiueAutomaticStyle();
    									anchorStyle.setProperty(OdfTableCellProperties.BorderTop, "0.5pt solid #000000");
    									anchorStyle.setProperty(OdfTableCellProperties.BorderBottom, "0.5pt solid #000000");
    									anchorStyle.setProperty(OdfTableCellProperties.BorderLeft, "0.5pt solid #000000");
    									anchorStyle.setProperty(OdfTableCellProperties.BorderRight, "0.5pt solid #000000");
    									log.debug("Border set on anchor " + mg2.row + "-" + mg2.col
    										+ " | style=" + anchorEl.getStyleName()
    										+ " | spanned-cols=" + anchorEl.getTableNumberColumnsSpannedAttribute()
    										+ " | readback-right=" + anchorStyle.getProperty(OdfTableCellProperties.BorderRight));
    								} catch (e) {
    									log.error("Border on anchor " + mg2.row + "-" + mg2.col + " failed: " + e);
    								}
    							}
    						}
    					} else {
    						log.debug("No merges to apply for this table");
    					}
    					// ===== FIN UPSTREAM 1.11.5 #2 =====
    
    					var odfTable = table1.getOdfElement();
    					var odfTableStyle = odfTable.getAutomaticStyle();
    					odfTableStyle.setProperty(OdfTableProperties.BreakBefore, ((break_before && break_before != "") ? break_before : "page"));
    					//odfTableStyle.setProperty(OdfTableProperties.BreakAfter, "page");
    					odfTableStyle.setProperty(OdfTableProperties.KeepWithNext, "false");
    					// UPSTREAM 1.11.5 #1 (suite) : avant 1.11.5 = fdoc.getTableByName("table1")
    					item.replaceWith(fdoc.getTableByName(uniqueTableName));
    					table1.remove();
    				}
    				break;
    			case "span":
    				var span = Span.newSpan(item);
    				var styleHandler = span.getStyleHandler();
    				styleHandler.getTextPropertiesForWrite().setFont(setTextFont(tag.style));
    				span.setTextContent(tag.value);
    				break;
    			case "array":
    				var arrayValues = tag.value;			    
    				var tempMarkers = [];
    				    
    			    for (var j = 0; j < arrayValues.length; j++) {
    			        tempMarkers.push("##ARRAY_" + j + "_" + new Date().getTime() + "##");
    			    }
    			    item.replaceWith(tempMarkers.join(""));
    			    
    			    for (var j = 0; j < arrayValues.length; j++) {
    			        var subTag = {
    			            tag: tempMarkers[j],
    			            type: arrayValues[j].type,
    			            value: arrayValues[j].value,
    			            style: arrayValues[j].style,
    			            // ===== UPSTREAM 1.11.5 #3 : propagation de "merges" =====
    			            // AVANT 1.11.5 : cette ligne n''existe pas (subTag s''arrete a "style").
    			            //
    			            // POURQUOI : subTag est reconstruit champ par champ, donc TOUTE
    			            // propriete du sous-tag autre que tag/type/value/style est perdue
    			            // avant l''appel recursif a processTagReplacement(). Pour un tableau
    			            // imbrique dans un tag de type "array" (cas d''usage principal :
    			            // contenu riche melangeant texte et tableaux sous un seul marqueur),
    			            // tag.merges arrivait donc toujours a undefined dans le case "table"
    			            // -> l''evolution #2 restait sans effet, sans aucune erreur visible.
    			            //
    			            // Une copie generique des proprietes serait plus robuste pour de
    			            // futures extensions, mais la copie explicite est retenue ici car
    			            // l''acces par propriete (arrayValues[j].xxx) est deja prouve
    			            // fonctionnel dans ce code, contrairement a un for...in dont le
    			            // comportement depend de la nature exacte de l''objet cote Rhino.
    			            merges: arrayValues[j].merges
    			            // ===== FIN UPSTREAM 1.11.5 #3 =====
    			        };
    			        var sub_nav = new TextNavigation(
    			            java.util.regex.Pattern.quote(tempMarkers[j]), fdoc
    			        );
    			        while (sub_nav.hasNext()) {
    			            var subItem = sub_nav.nextSelection();
    			            processTagReplacement(fdoc, subTag, subItem);
    			        }
    			    }
    				break;	
    			case "newline":
    			    item.replaceWith("\n");
    			    break;
    			case "paragraph":
    			case "string":
    			default:
    				item.replaceWith(tag.value);
    		}
    	}
    
    	function replace_text(fdoc, tags) {
    		for (var i = 0; i < tags.length; i++) {
    			log.debug("tag: " + tags[i].tag);
    			log.debug("tag type: " + tags[i].type);
    			log.debug("tag value: " + tags[i].value);
    			var txt_nav = null;
    			txt_nav = new TextNavigation(java.util.regex.Pattern.quote(tags[i].tag), fdoc);
    			while (txt_nav.hasNext()) {
    				item = txt_nav.nextSelection();
    				log.debug("item Text: " + item.getText());
    				log.debug("item Index: " + item.getIndex());
    				processTagReplacement(fdoc, tags[i], item);
    			}
    		}
    	}
    
    	try {
    		var document = null;
    		if (o_markers != null) {
    			document = TextDocument.loadDocument(template_path);
    			replace_text(document, o_markers);
    		}
    	} catch (e) {
    		log.warn("ERROR: " + e);
    	} finally {
    		if (document) {
    			var meta = document.getOfficeMetadata();
    			if (meta_title != null) meta.setTitle(meta_title);
    			if (meta_subject != null) meta.setSubject(meta_subject);
    			if (meta_keywords != null) meta.setKeywords(Arrays.asList(meta_keywords));
    			//if(meta_creator != null) meta.setCreator(meta_creator);
    			if (meta_initial_creator != null) meta.setInitialCreator(meta_initial_creator);
    			if (meta_description != null) meta.setDescription(meta_description);
    			if (meta_creation_date != null && meta_creation_date != "") {
    				var new_creation_date = null;
    				if (meta_creation_date == "now") {
    					new_creation_date = java.util.GregorianCalendar();
    				} else {
    					try {
    						// Convertir une date ISO 8601 fournie en GregorianCalendar
    						var formatter = new java.text.SimpleDateFormat("yyyy-MM-dd''T''HH:mm:ss");
    						var parsedDate = formatter.parse(meta_creation_date);
    						var calendar = new java.util.GregorianCalendar();
    						calendar.setTime(parsedDate);
    						new_creation_date = calendar;
    					} catch (e) {
    						log.error("ERROR: Can not parse date: " + meta_creation_date);
    						log.error("ERROR DETAILS: " + e);
    					}
    				}
    				if(new_creation_date != null) meta.setCreationDate(new_creation_date);
    			}
    
    			document.save(output_path);
    		}
    	}
    }'
